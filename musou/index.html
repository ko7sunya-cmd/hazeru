<style>
/* Layout: full-bleed neon arena canvas. HUD pinned to the top edge, overlays are centred sheets with corner-bracket cards. One look only: dark arcade. */
:root{
  --bg:#07061a;
  --ink:#eef2ff;
  --ink-dim:#9aa3d6;
  --panel:rgba(14,12,42,.86);
  --line:rgba(160,170,255,.24);
  --cyan:#2ef2ff;
  --pink:#ff3d8b;
  --amber:#ffb43a;
  --lime:#9dff4a;
  --violet:#a98bff;
  --font-display:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --font-num:'Chakra Petch','Zen Kaku Gothic New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:manipulation}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* HUD */
#hud{position:absolute;inset:0;z-index:2;pointer-events:none;padding:0 16px}
.xp{position:absolute;left:0;right:0;top:0;height:5px;background:rgba(169,139,255,.18)}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),#e6dcff);box-shadow:0 0 12px var(--violet)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;padding-top:16px}
.hleft{min-width:0;display:grid;gap:6px}
.hp{display:flex;align-items:center;gap:8px;min-width:0}
.hp .lbl{font:700 11px var(--font-num);letter-spacing:.14em;color:var(--ink-dim)}
.hp .bar{flex:1;max-width:180px;height:10px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.hp .bar i{display:block;height:100%;width:100%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);transition:width .12s}
.hp.low .bar i{background:var(--pink);box-shadow:0 0 10px var(--pink)}
.hp b{font:700 13px var(--font-num);font-variant-numeric:tabular-nums;min-width:3ch}
.meta{font:700 11px var(--font-num);letter-spacing:.1em;color:var(--ink-dim)}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px}
.meta span{white-space:nowrap}
.meta b{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.wv{display:flex;align-items:center;gap:5px;font:700 11px var(--font-num);letter-spacing:.1em;color:var(--ink-dim)}
.wv b{white-space:nowrap;flex:none}
.wv i{display:block;width:34px;height:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);overflow:hidden}
.wv u{display:block;height:100%;width:0;background:var(--cy,#2ef2ff)}
.wv i.full u{background:#fff;box-shadow:0 0 8px #fff}
.wv.rdy b{color:#fff}
.clock{font:700 26px var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.04em;text-align:center}
.btns{justify-self:end;display:flex;gap:8px}
.ib{pointer-events:auto;width:34px;height:34px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:0}
.ib svg{width:18px;height:18px}
.ib.muted .wave{display:none}
#bossBar{position:absolute;left:16px;right:16px;top:106px;display:flex;align-items:center;gap:8px;font:700 12px var(--font-body);color:#fff;text-shadow:0 0 8px #000}
#bossBar .bar{flex:1;height:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35)}
#bossBar .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff5c8a,#ffb43a);box-shadow:0 0 10px #ff5c8a}
#bossBar b{font:700 11px var(--font-num);color:var(--ink-dim);white-space:nowrap}
#combo{position:absolute;left:50%;top:60px;transform:translateX(-50%);font:700 18px var(--font-num);letter-spacing:.12em;color:var(--amber);text-shadow:0 0 14px rgba(255,180,58,.75);white-space:nowrap;opacity:0;transform-origin:center}
#toast{position:absolute;left:50%;top:34%;transform:translateX(-50%);font:400 clamp(22px,5vw,38px) var(--font-display);color:var(--pink);text-shadow:0 0 22px rgba(255,61,139,.8);white-space:nowrap;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}

/* Overlays */
.overlay{position:absolute;inset:0;z-index:5;display:flex;padding:20px 16px;overflow-y:auto;background:rgba(5,4,18,.74);touch-action:pan-y}
.sheet{margin:auto;width:min(940px,100%);display:grid;gap:18px;justify-items:center;text-align:center}
.title{margin:0;font:400 clamp(44px,13vw,108px)/.95 var(--font-display);letter-spacing:.01em;text-shadow:3px 0 var(--pink),-3px 0 var(--cyan);text-wrap:balance}
.title span{display:block;font-size:.6em;margin-top:.14em;letter-spacing:.22em}
.lead{margin:0;max-width:34em;color:var(--ink-dim);font-size:15px;line-height:1.8;text-wrap:balance}
h2.big{margin:0;font:400 clamp(30px,7vw,52px)/1 var(--font-display);text-wrap:balance}
.chars,.picks{width:100%;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));text-align:left}
.char,.pick{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);padding:16px;display:grid;gap:8px;align-content:start;color:var(--ink);transition:transform .12s,border-color .12s,background .12s}
.char::before,.pick::before,.char::after,.pick::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--c);pointer-events:none}
.char::before,.pick::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.char::after,.pick::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.char:hover,.pick:hover,.char:focus-visible,.pick:focus-visible{transform:translateY(-3px);border-color:var(--c);background:rgba(30,26,74,.94)}
.char svg{width:46px;height:46px;color:var(--c);filter:drop-shadow(0 0 8px var(--c))}
.cn{display:block;font:400 22px var(--font-display);color:var(--c)}
.cr{display:block;font:700 11px var(--font-num);letter-spacing:.14em;color:var(--ink-dim)}
.cd{display:block;font-size:13px;line-height:1.7;color:var(--ink)}
.meters{display:grid;gap:5px;margin-top:4px}
.m{display:flex;align-items:center;gap:8px;font:700 11px var(--font-num);color:var(--ink-dim);letter-spacing:.06em}
.m i{font-style:normal;width:3.4em}
.m b{display:flex;gap:3px}
.m u{width:15px;height:6px;background:rgba(255,255,255,.12)}
.m u.on{background:var(--c);box-shadow:0 0 6px var(--c)}
.hint,.best{margin:0;font-size:12px;color:var(--ink-dim);line-height:1.8;text-wrap:balance}
.best{font-family:var(--font-num);letter-spacing:.1em;color:var(--amber)}
.tag{font:700 11px var(--font-num);letter-spacing:.16em;color:var(--c)}
.pn{font:400 20px var(--font-display)}
.pips{display:flex;gap:4px}
.pips u{width:16px;height:5px;background:rgba(255,255,255,.14)}
.pips u.on{background:var(--c)}
.pips u.next{background:var(--c);opacity:.45;animation:blink 1s steps(2) infinite}
.pd{font-size:13px;line-height:1.7}
.key{position:absolute;right:12px;top:10px;font:700 12px var(--font-num);color:var(--ink-dim);border:1px solid var(--line);padding:1px 7px}
@keyframes blink{50%{opacity:.1}}
.logs{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-width:38em;text-align:left;font-size:13px;line-height:1.7;color:var(--ink)}
.logs li{border-left:3px solid var(--cyan);padding-left:10px}
.logs li.dim{color:var(--ink-dim);border-left-color:var(--line)}
/* hub */
.hub{position:absolute;inset:0;z-index:6;background:var(--bg);overflow:hidden;touch-action:pan-y}
.hubcol{width:min(520px,100%);height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.mapbox{position:relative;width:100%;padding-top:66.667%;flex:none;background:#000;overflow:hidden}
.mapbox img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.mapbox::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(rgba(7,6,26,0),var(--bg));pointer-events:none}
.mtitle{position:absolute;left:10px;top:8px;z-index:2;font:400 15px var(--font-display);letter-spacing:.05em;text-shadow:2px 0 var(--pink),-2px 0 var(--cyan),0 0 10px #000}
.mtitle span{margin-left:.35em;font-size:.82em}
.msort{position:absolute;right:10px;top:10px;z-index:2;font:700 12px var(--font-num);letter-spacing:.1em;background:rgba(7,6,26,.72);border:1px solid var(--line);padding:3px 9px}
.pin{position:absolute;z-index:3;transform:translate(-50%,-50%);width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--c);color:#12101e;font:900 14px var(--font-num);box-shadow:0 0 14px var(--c)}
.pin.sel{transform:translate(-50%,-50%) scale(1.22);animation:pinp 1.4s ease-in-out infinite}
.pinlbl{position:absolute;left:50%;top:100%;margin-top:4px;transform:translateX(-50%);white-space:nowrap;font:700 10px var(--font-body);color:#fff;background:rgba(0,0,0,.7);border:1px solid var(--c);padding:1px 7px;border-radius:9px;pointer-events:none}
@keyframes pinp{50%{box-shadow:0 0 24px var(--c),0 0 0 7px rgba(255,255,255,.2)}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 4px;font:700 14px var(--font-body);color:var(--ink-dim)}
.tab.on{color:var(--ink);border-bottom-color:var(--cyan)}
.pane{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 12px 28px;display:grid;gap:12px;align-content:start}
.mrow{display:flex;gap:8px;align-items:center}
#paneQ>.mrow{position:sticky;top:-14px;z-index:3;background:var(--bg);margin:-14px -12px 0;padding:10px 12px;border-bottom:1px solid var(--line)}
.mlbl{font:700 11px var(--font-num);letter-spacing:.14em;color:var(--ink-dim)}
.mch{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);padding:8px 2px;font:700 12px var(--font-body)}
.mch small{font-size:10px;opacity:.8}
.grow{--c:#fff;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--panel);display:grid;gap:5px;margin:6px 0}
.gtop{display:flex;align-items:baseline;gap:10px;font-size:12px}
.gtop b{color:var(--c)}.gtop span{font:900 13px var(--font-num)}.gtop em{margin-left:auto;font-style:normal;color:var(--ink-dim);font-size:11px}
.thr{font:700 10px var(--font-num);color:var(--pink);letter-spacing:.06em}
.mch.on{border-color:var(--c);color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.acard,.hcard{position:relative;display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px;border:1px solid var(--c);border-left-width:6px;background:linear-gradient(90deg,rgba(var(--cr),.22),var(--panel) 62%);text-align:left}
.acard.sel{box-shadow:0 0 0 2px var(--c),0 0 18px rgba(var(--cr),.4)}
.aface{width:92px;height:138px;object-fit:cover;object-position:50% 20%;border:1px solid var(--c);display:block}
.abody{display:grid;gap:4px;align-content:start;min-width:0}
.atag{font:700 11px var(--font-num);letter-spacing:.1em;color:var(--c)}
.aname{font:400 18px var(--font-display);color:var(--ink)}
.ahero{font-size:13px;font-weight:700}
.fate{font-size:11px;color:var(--ink-dim);font-weight:500}
.fate.done{color:var(--amber)}
.aq{font-size:12px;color:var(--ink-dim);line-height:1.6}
.agauge{height:6px;background:rgba(255,255,255,.12)}
.agauge i{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c)}
.arank{font:700 11px var(--font-num);letter-spacing:.06em;color:var(--ink-dim)}
.arank b{color:var(--c);font-size:14px}
.go{width:100%;margin-top:4px;background:var(--c);color:#0a0a14;border:0;padding:9px;font:900 15px var(--font-body);letter-spacing:.3em}
.hcard p{margin:0;font-size:12px;line-height:1.7}
.hcard[data-talk]{cursor:pointer}
.hcard .talkgo{margin-top:4px;color:var(--cyan);font-weight:700}
.ndot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink);margin-right:6px;vertical-align:middle}
.tab.new{position:relative}.tab.new::after{content:"";position:absolute;top:9px;right:calc(50% - 40px);width:8px;height:8px;border-radius:50%;background:var(--pink)}
.hcard .dim,.dim{color:var(--ink-dim)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.srow b{font-family:var(--font-num)}
.rsec{font:700 12px var(--font-num);letter-spacing:.14em;color:var(--amber);margin:6px 0 -4px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rcell{padding:8px 10px;background:var(--panel);border:1px solid var(--line);font-size:12px;line-height:1.5}
.rcell.off{opacity:.45}
.rcell b{font-family:var(--font-num)}
.ttl{display:inline-block;margin:0 6px 6px 0;padding:5px 10px;border:1px solid var(--amber);color:var(--amber);font-size:12px}
.ttl.off{border-color:var(--line);color:var(--ink-dim);opacity:.55}
.rrun{padding:8px 12px;background:var(--panel);border:1px solid var(--line);font-size:12px;line-height:1.7}
.titlescr{position:absolute;inset:0;z-index:9;background:#07061a;display:flex;flex-direction:column;align-items:center;padding:0 0 calc(14px + env(safe-area-inset-bottom,0px))}
.titlescr img{width:100%;flex:1;min-height:0;object-fit:contain;display:block;-webkit-user-drag:none}
.tbtn{min-width:220px;font-size:18px;letter-spacing:.4em;padding:14px 30px;animation:tbp 2.2s ease-in-out infinite}
.stlines{width:min(520px,100%);text-align:left;display:grid;gap:12px;min-height:150px;align-content:start}
.stlines p{margin:0;font-size:15px;line-height:1.9;animation:stin .55s both}
.stlines p.nar{color:var(--ink-dim);font-size:14px}
.stlines p.say{color:#fff}
@keyframes stin{from{opacity:0;transform:translateY(6px)}}
#story{background:rgba(5,4,18,.97)}
#story.pro{background:linear-gradient(rgba(5,4,18,.86),rgba(5,4,18,.94)),url(assets/map.webp) center/cover}
.hbtn{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 18px;font:700 13px var(--font-body);letter-spacing:.18em;margin-top:10px}
.hbtn:hover{border-color:var(--cyan)}
.qbtn{position:absolute;right:10px;top:38px;z-index:3;width:28px;height:28px;padding:0;border-radius:50%;background:rgba(7,6,26,.72);border:1px solid var(--line);color:var(--ink);font:900 14px var(--font-num)}
#help{z-index:10;background:rgba(5,4,18,.9)}
#help .sheet{width:min(520px,100%);gap:14px}
.hcardx{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);padding:18px 16px;display:grid;gap:12px}
.hcardx h3{margin:0;font:900 18px var(--font-body);letter-spacing:.08em;color:var(--cyan)}
.hrow2{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.7}
.hrow2 .em{font-size:24px;line-height:1.3;text-align:center}
.hrow2 b{color:#fff}
.hdots{display:flex;gap:8px}
.hdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.hdots i.on{background:var(--cyan)}
.tcopy{margin:8px 0 0;font:700 10px var(--font-num);letter-spacing:.16em;color:var(--ink-dim)}
@keyframes tbp{50%{filter:brightness(1.25);box-shadow:0 0 22px rgba(46,242,255,.5)}}
@media (prefers-reduced-motion:reduce){.tbtn{animation:none}}
.amatch{font-size:11px;font-weight:700}
.am0{color:var(--pink)}.am1{color:var(--ink-dim)}.am2{color:var(--amber)}
.mtab{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);font-size:12px;text-align:center}
.mtab>div{background:var(--panel);padding:8px 2px;font-weight:700}
.mtab .mh{font:700 11px var(--font-num);color:var(--ink-dim)}
.dface{width:104px;height:156px;object-fit:cover;object-position:50% 20%;border:2px solid var(--c,#fff);box-shadow:0 0 20px var(--c,#fff)}
.eface{width:min(50vw,220px);height:min(75vw,330px);object-fit:cover;object-position:50% 20%;border:2px solid var(--c,#fff);box-shadow:0 0 26px var(--c,#fff)}
.eface.still{width:min(64vw,300px);height:auto;aspect-ratio:2/3;max-height:46vh;object-position:50% 30%}
.res{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 36px}
.res div{display:grid;gap:2px}
.res b{font:700 40px var(--font-num);font-variant-numeric:tabular-nums;line-height:1}
.res span{font:700 11px var(--font-num);letter-spacing:.16em;color:var(--ink-dim)}
.rec{font:700 13px var(--font-num);letter-spacing:.18em;color:var(--amber);margin:0;min-height:1em}
.build{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:34em}
.build li{border:1px solid var(--c);color:var(--c);padding:4px 10px;font-size:12px;font-weight:700}
.build li em{font-style:normal;font-family:var(--font-num);color:var(--ink);margin-left:6px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.btn{background:var(--cyan);color:#04121a;border:0;padding:12px 26px;font:900 15px var(--font-body);letter-spacing:.06em}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.12)}
@media (max-width:560px){
  .clock{font-size:22px}

}
@media (prefers-reduced-motion:reduce){.pips u.next{animation:none}.char,.pick{transition:none}}
</style>

function bgm(n,restart){

function bgmTick(){
  for(const k in bgmEl){

    try{a.volume=Math.max(0,Math.min(1,a._v))}catch(e){}
    if(!cur&&a._off&&Date.now()>a._off){a._v=0;if(!a.paused)a.pause()} /* 保険: 3秒で必ず停止 */
    if(!on&&a._v<=0&&!a.paused&&!a._bad)a.pause(); /* 音量0になったら必ず停止(旧曲・ミュート) */
    if(on&&a.paused&&!a._bad&&!a.ended)bgmPlay(a);
  }
}

/* ---------- spatial grid ---------- */
function gridBuild(){
  gHead.fill(-1); const en=S.enemies;
  for(let i=0;i<en.length;i++){
    const e=en[i]; if(e.dead)continue;
    let cx=(e.x/CS)|0, cy=(e.y/CS)|0;
    if(cx<0)cx=0;else if(cx>=GW)cx=GW-1;
    if(cy<0)cy=0;else if(cy>=GH)cy=GH-1;
    const k=cy*GW+cx; gNext[i]=gHead[k]; gHead[k]=i;
  }
}
function forNear(x,y,rad,fn){
  const x0=clamp(Math.floor((x-rad)/CS),0,GW-1),x1=clamp(Math.floor((x+rad)/CS),0,GW-1);
  const y0=clamp(Math.floor((y-rad)/CS),0,GH-1),y1=clamp(Math.floor((y+rad)/CS),0,GH-1);
  const en=S.enemies;
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){
    for(let i=gHead[cy*GW+cx];i!==-1;i=gNext[i]){const e=en[i];if(e.dead)continue;if(fn(e)===true)return}
  }
}
function nearestEnemy(x,y,maxD){
  let best=null,bd=maxD*maxD; const en=S.enemies;
  for(let i=0;i<en.length;i++){const e=en[i];if(e.dead)continue;const d=(e.x-x)*(e.x-x)+(e.y-y)*(e.y-y);if(d<bd){bd=d;best=e}}
  return best;
}

function updateWeapons(dt){

      if(Math.abs(d-r.r)<16+e.r){
        r.hit.add(e); e.kx+=dx/d*(r.kb||260); e.ky+=dy/d*(r.kb||260);
        hitEnemy(e,16*p.dmgMul*gb*(r.dm||1)*(e.boss?1.8:1),true);
      }
    }
  }
  prune(S.rings,r=>r.r<r.maxR);
  // fields
  for(const f of S.fields){
    f.life-=dt; f.tick-=dt;
    if(f.life<=0&&f.bloom&&!f.done){f.done=true;burst(f.x,f.y,'#9dff4a',14,260,3,.5);
      forNear(f.x,f.y,f.r*(f.bw||1.25)+30,e=>{const dx=e.x-f.x,dy=e.y-f.y,d=Math.hypot(dx,dy)||1,rr=f.r*(f.bw||1.25)+e.r;if(dx*dx+dy*dy<rr*rr){hitEnemy(e,16*p.dmgMul*(f.bj||1)*(e.boss?.65:1),true);e.kx+=dx/d*160;e.ky+=dy/d*160}})}
    if(f.tick<=0&&f.life>0){
      f.tick+=.25;
      forNear(f.x,f.y,f.r+30,e=>{
        const dx=e.x-f.x,dy=e.y-f.y;
        if(dx*dx+dy*dy<(f.r+e.r*.5)*(f.r+e.r*.5)){e.slow=.35;hitEnemy(e,3.5*p.dmgMul*(f.dm||1)*(e.boss?.65:1),rand()<.3)}
      });
    }
  }
  prune(S.fields,f=>f.life>0);
  // bits
  const nb=p.up.bits;
  if(nb>0){
    p.bitAng+=dt*2.4;
    for(let i=0;i<nb;i++){
      p.bitCd[i]-=dt;
      if(p.bitCd[i]<=0){
        const a=p.bitAng+i*TAU/nb, bx=p.x+Math.cos(a)*58, by=p.y+Math.sin(a)*58;
        const t=nearestEnemy(bx,by,340);
        if(t){
          const ta=Math.atan2(t.y-by,t.x-bx);
          S.bullets.push({x:bx,y:by,vx:Math.cos(ta)*540,vy:Math.sin(ta)*540,r:3.5*p.size,dmg:7*p.dmgMul,pierce:0,life:1,col:'#ff8ad8',hits:[],chain:true});
          p.bitCd[i]=.75*p.cdMul;
        }else p.bitCd[i]=.15;
      }
    }
  }
  // bullets
  for(const b of S.bullets){
    const steps=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/10));
    for(let s=0;s<steps&&b.life>0;s++){
      b.x+=b.vx*dt/steps; b.y+=b.vy*dt/steps;
      forNear(b.x,b.y,b.r+34,e=>{
        const dx=e.x-b.x,dy=e.y-b.y,rr=b.r+e.r;
        if(dx*dx+dy*dy>=rr*rr||b.hits.includes(e))return;
        hitEnemy(e,b.dmg,b.chain);
        if(b.blast){ /* 着弾で小爆発: 周囲の敵にも半分のダメージ(当たり判定が広がる) */
          const bx=e.x,by=e.y,src=e,bd=b.dmg*(b.bdm||.5),br=b.blast;
          burst(bx,by,b.col,7,170,2.5,.28);
          forNear(bx,by,br+30,t=>{if(t===src||t.dead)return;const ddx=t.x-bx,ddy=t.y-by,rr2=br+t.r;if(ddx*ddx+ddy*ddy<rr2*rr2)hitEnemy(t,bd,false)});
        }
        if(b.pierce>0){b.pierce--;b.hits.push(e)}else{b.life=0;return true}
      });
    }
    b.life-=dt;
    if(b.x<-60||b.x>W+60||b.y<-60||b.y>H+60)b.life=0;
  }
  prune(S.bullets,b=>b.life>0);
}

  }).join('');
  $('lvSub').textContent='LV '+p.lv+'  強化を1つ選んでください (キー 1・2・3)';
  $('lvl').hidden=false; sfxLevel();

}
function pick(i){
  if(S.mode!=='levelup')return;
  if(S.evoMode){if(i===0||i===1)chooseJob(i);return}
  const u=S.choices[i]; if(!u)return;
  const p=S.player; p.up[u.k]++;
  if(u.k==='body'){S.base.max+=25;S.base.hp=Math.min(S.base.max,S.base.hp+S.base.max*.3)}
  recalc(p);
  $('lvl').hidden=true; S.mode='play'; last=0;
}

/* ---------- main step ---------- */
function fx(dt){
  for(const q of S.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.pow(.04,dt);q.vy*=Math.pow(.04,dt);q.life-=dt}
  prune(S.parts,q=>q.life>0);
  for(const b of S.bolts)b.life-=dt;
  prune(S.bolts,b=>b.life>0);
  S.shake*=Math.exp(-dt*10); if(S.shake<.05)S.shake=0;
}
function heroStep(dt){
  const h=S.hero,A=S.area,b=S.base; h.cd-=dt;
  h.a+=dt*(A.id==='a'?2.2:1.2);
  const R=A.id==='a'?80:60; h.x=b.x+Math.cos(h.a)*R; h.y=b.y+Math.sin(h.a)*R;
  if(A.id==='a'){
    if(h.cd<=0){h.cd=.16;forNear(h.x,h.y,52,e=>{const dx=e.x-h.x,dy=e.y-h.y,rr=34+e.r;if(dx*dx+dy*dy<rr*rr)hitEnemy(e,16,false)})}
  }else if(A.id==='b'){
    if(h.cd<=0){
      h.cd=.65;
      const d2=e=>(e.x-b.x)*(e.x-b.x)+(e.y-b.y)*(e.y-b.y);
      const c=S.enemies.filter(e=>!e.dead&&d2(e)<300*300).sort((p,q)=>d2(p)-d2(q)).slice(0,3);
      for(const e of c){addBolt(h.x,h.y,e.x,e.y);hitEnemy(e,22,false)}
    }
  }else{
    const br=S.bar;
    if(br.on){
      br.left-=dt; br.k-=dt;
      if(br.left<=0)br.on=false;
      else if(br.k<=0){br.k=.2;forNear(b.x,b.y,130,e=>{e.slow=.4})}
    }else if(h.cd<=0){h.cd=12;br.on=true;br.left=3.5;br.k=0;sfxLevel()}
  }
}
function step(dt){
  const p=S.player; S.t+=dt;
  const mv=moveVec(); p.mx=mv[0]; p.my=mv[1];
  p.x=clamp(p.x+mv[0]*p.speed*dt,p.r,W-p.r); p.y=clamp(p.y+mv[1]*p.speed*dt,p.r,H-p.r);
  p.inv=Math.max(0,p.inv-dt);
  // spawn
  S.spawnAcc+=Math.min(2.2+S.t*.045,9)*S.area.rate*(1+DIFF_SPAWN*(S.visit||0))*dt;
  while(S.spawnAcc>=1){S.spawnAcc--;const q=edgePos();spawnEnemy(pickType(),q[0],q[1])}
  if(S.visit>=BOSS_VISIT&&!S.boss&&S.t>=BOSS_T)spawnBoss();
  if(S.t>=S.nextWave){
    S.nextWave+=30; toast('包囲網 接近中');
    const n=26+Math.floor(S.t/30)*4, R=Math.max(W,H)*.62;
    for(let i=0;i<n;i++){const a=i/n*TAU;spawnEnemy(S.t>60?'swift':'grunt',S.base.x+Math.cos(a)*R,S.base.y+Math.sin(a)*R)}
  }
  // villages
  for(const v of S.vill){
    v.flash-=dt;
    if(v.st==='idle'&&S.t>=v.raidAt){v.st='raid';v.left=v.n;v.acc=0;toast('🆘 村が襲われている！');sfxLevel()}
    if(v.st==='raid'){
      v.acc+=dt*4;
      while(v.acc>=1&&v.left>0){
        v.acc--;v.left--;
        const dx=v.x-S.base.x,dy=v.y-S.base.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
        const off=240+rand()*80, side=(rand()-.5)*140;
        spawnEnemy(rand()<.3?'swift':'grunt',v.x+ux*off-uy*side,v.y+uy*off+ux*side,v);
      }
      if(v.hp<=0){v.st='lost';burst(v.x,v.y,'#ff8a3d',30,240,3,.8);toast('🔥 村が…')}
      else if(v.left<=0&&!S.enemies.some(e=>!e.dead&&e.tg===v)){v.st='saved';burst(v.x,v.y,'#ffd27a',30,240,3,.8);toast('✨ 村を救った！');sfxLevel()}
    }
  }
  S.base.flash-=dt; S.base.hp=Math.min(S.base.max,S.base.hp+dt*(.4+((p.job===0&&p.ch.w==='ring')?1+.3*p.jl+p.up.g_regen:0)));
  if(S.t>=STAGE_T&&S.mode==='play'&&!(S.boss&&!S.boss.dead))endRun(true);
  // enemies
  const en=S.enemies, kf=Math.exp(-dt*7);
  for(let i=0;i<en.length;i++){
    const e=en[i]; if(e.dead)continue;
    if(e.boss){
      const B=BOSS[S.areaId], bx=S.base.x-e.x, by=S.base.y-e.y, bd=Math.hypot(bx,by)||1; e.slow-=dt; e.flash-=dt; e.kx=0; e.ky=0; e.ang=Math.atan2(by,bx);
      if(bd>54+e.r*.3){
        const sp=e.sp*(e.slow>0?.8:1); e.x+=bx/bd*sp*dt; e.y+=by/bd*sp*dt;
        if(e.wob){e.x+=-by/bd*Math.sin(S.t*3+e.ph)*46*dt; e.y+=bx/bd*Math.sin(S.t*3+e.ph)*46*dt}
      }else if(!S.bar.on){
        S.base.hp-=BOSS_DPS*(1+.1*(S.visit-BOSS_VISIT))*dt; S.base.flash=.1; S.shake=Math.max(S.shake,1.5);
        if(S.base.hp<=0&&S.mode==='play'){endRun(false);break}
      }
      if(B.adds&&e.hp>0){S.bossAdd-=dt;if(S.bossAdd<=0){S.bossAdd=10;for(let k=0;k<6;k++){const a=k/6*TAU;spawnEnemy('swift',e.x+Math.cos(a)*40,e.y+Math.sin(a)*40)}}}
      continue;
    }
    const T=e.tg&&e.tg.hp>0?e.tg:S.base,dx=T.x-e.x,dy=T.y-e.y,d=Math.hypot(dx,dy)||1, sp=e.sp*(e.slow>0?(S.slowK||.55):1);
    e.slow-=dt; e.flash-=dt; e.ang=Math.atan2(dy,dx);
    if(T!==S.base&&d<20+e.r*.4){T.hp-=e.dmg*.35*dt;T.flash=.1;continue}
    e.x+=dx/d*sp*dt+e.kx*dt; e.y+=dy/d*sp*dt+e.ky*dt; e.kx*=kf; e.ky*=kf;
    if(T===S.base&&d<36+e.r*.4)reach(e);
  }
  gridBuild();
  updateWeapons(dt);
  // castle turret
  const bs=S.base; bs.cd=(bs.cd||0)-dt;
  if(bs.cd<=0){bs.cd=.35;let n=0;forNear(bs.x,bs.y,170,e=>{addBolt(bs.x,bs.y,e.x,e.y);hitEnemy(e,(p.job===0&&p.ch.w==='ring')?6*(1.6+.12*p.jl):6,false);if(++n>=2+((p.job===0&&p.ch.w==='ring')?p.up.g_turret:0))return true})}
  heroStep(dt);
  // gems
  for(const g of S.gems){
    const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy)||1;
    if(!g.mag&&d<p.magnet)g.mag=true;
    if(g.mag){const sp=Math.min(760,260+(p.magnet*2-d)*2+400);g.vx=dx/d*sp;g.vy=dy/d*sp}
    else{g.vx*=Math.pow(.02,dt);g.vy*=Math.pow(.02,dt)}
    g.x+=g.vx*dt; g.y+=g.vy*dt;
    if(d<p.r+7){g.v=-g.v;addXp(-g.v);sfxGem()}
  }
  prune(S.gems,g=>g.v>0);
  prune(en,e=>!e.dead);
  // combo
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0}
  S.pulse=Math.max(0,S.pulse-dt*5);
  fx(dt);
  if(S.mode==='play'&&p.xp>=p.need){p.xp-=p.need;p.lv++;p.need=needFor(p.lv);openLevelUp()}
}
function update(dt){
  S.clock+=dt;
  if(S.mode==='play')step(dt);
  else if(S.mode==='dead'){
    fx(dt); S.deadT+=dt;
    if(S.deadT>1&&!deadReady)showDead();
  }else if(S.mode==='menu'){
    for(const a of S.ambient){a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.y<-10){a.y=H+10;a.x=rand()*W}if(a.x<-10)a.x=W+10;if(a.x>W+10)a.x=-10}
  }
}

const enLoad=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('load '+src));i.src=src});
function enStop(){enTok++;if(enRaf){cancelAnimationFrame(enRaf);enRaf=0}enCv.hidden=true}
async function enParallax(imgSrc,depSrc,col){
  if(reduceMotion)return; const tk=++enTok;
  try{
    const [im,dp]=await Promise.all([enLoad(imgSrc),enLoad(depSrc)]); if(tk!==enTok)return;
    const g=enInit(); enTex(g,im,0); enTex(g,dp,1);
    enCv.style.setProperty('--c',col||'#fff'); enCv.hidden=false; $('enImg').hidden=true;
    enCur=[0,0]; enTgt=[0,0]; enIn=-1e9;
    const gl=g.gl,U=g.U;
    const frame=()=>{
      if(tk!==enTok||$('ending').hidden)return;
      const r=enCv.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2), w=Math.max(2,Math.round(r.width*dpr)), h=Math.max(2,Math.round(r.height*dpr));
      if(enCv.width!==w||enCv.height!==h){enCv.width=w;enCv.height=h}
      const now=performance.now(); let tx=enTgt[0], ty=enTgt[1];
      if(now-enIn>2500){const ph=now/2200; tx=Math.cos(ph)*0.26; ty=Math.sin(ph)*0.20}
      enCur[0]+=(tx-enCur[0])*0.07; enCur[1]+=(ty-enCur[1])*0.07;
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,g.tex[0]); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,g.tex[1]);
      gl.viewport(0,0,w,h); gl.uniform2f(U.uRes,w,h); gl.uniform2f(U.uImgSize,im.naturalWidth,im.naturalHeight);
      gl.uniform2f(U.uMouse,enCur[0],enCur[1]); gl.uniform1f(U.uStr,0.040); gl.uniform1f(U.uFocus,0.96);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4); enRaf=requestAnimationFrame(frame);
    };
    frame();
  }catch(e){ if(tk===enTok){enCv.hidden=true;$('enImg').hidden=false} }
}
addEventListener('pointermove',e=>{ if($('ending').hidden)return; enTgt=[(e.clientX/innerWidth)*2-1,-((e.clientY/innerHeight)*2-1)]; enIn=performance.now() });

/* ----- ending ----- */
let enPages=[],enIdx=0;
function buildEnding(sv){
  const pages=[];
  AIDS.forEach(id=>{
    const A=AREAS[id],r=rankIdx(sv.pts[id]);
    pages.push({img:r>=3?stillOf(id):faceOf(id,r>=2),alt:faceOf(id,r>=2),still:r>=3,depth:r>=3?stillOf(id).replace('.webp','_depth.webp'):null,col:A.col,tag:'AREA '+A.code+'　'+A.country,title:A.full+'　貢献度 '+RANK_L[r],text:EPI[id][r]});
  });
  const top=AIDS.slice().sort((x,y)=>sv.pts[y]-sv.pts[x])[0], T=AREAS[top];
  pages.push({img:faceOf(top,true),col:T.col,tag:'MAIN ENDING',title:'最も守った国　'+T.country,text:MAIN[top]});
  const trueEnd=AIDS.every(id=>rankIdx(sv.pts[id])>=2);
  const total=AIDS.map(id=>AREAS[id].nm+' '+RANK_L[rankIdx(sv.pts[id])]).join('　');
  pages.push({img:null,col:'#ffb43a',tag:trueEnd?'TRUE END':'NORMAL END',title:'総評',
    text:'出撃 '+Math.min(sv.sorties,SORTIES_MAX)+'回　貢献度　'+total+'<br><br>'+
      (trueEnd?'三つの国が、同じ空の下で朝を迎えた。':'守りきれなかったものもある。それでも、明日は来る。')+
      '<br><br>スタンピードの波はおさまった。<br>一時的な平穏を取り戻せた。'});
  return {pages,trueEnd};
}
function showEnPage(){
  const p=enPages[enIdx], last=enIdx===enPages.length-1;
  $('enTag').textContent=p.tag; $('enTag').style.color=p.col||'var(--amber)';
  const im=$('enImg'); enStop(); if(p.img){im.classList.toggle('still',!!p.still);im.onerror=p.alt?()=>{im.onerror=null;im.classList.remove('still');im.src=p.alt}:null;im.src=p.img;im.style.setProperty('--c',p.col||'#fff');im.hidden=false;if(p.still&&p.depth)enParallax(p.img,p.depth,p.col)}else im.hidden=true;
  $('enTitle').textContent=p.title; $('enText').innerHTML=p.text;
  $('btnEnNext').textContent=last?'マップへ戻る':'次へ';
}
function openEnding(review){
  const sv=loadSave(), E=buildEnding(sv); enPages=E.pages; enIdx=0;
  if(!review){
    sv.ended=true;sv.trueEnd=E.trueEnd;saveSave(sv);
    const r=loadRec(), tB=titlesOf(r), d=new Date();
    r.ended++; if(E.trueEnd)r.trueEnds++; if(AIDS.every(id=>sv.pts[id]>=300))r.allS++;
    r.runs.unshift({no:r.ended,date:d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(),te:E.trueEnd,rk:{a:rankIdx(sv.pts.a),b:rankIdx(sv.pts.b),c:rankIdx(sv.pts.c)},
      m:CHARS.map((c,i)=>({n:c.name,lv:mlv(sv.xp[i]||0),j:sv.job[i]>=0?JOBS[i][sv.job[i]].e+JOBS[i][sv.job[i]].n:'',x:sv.xp[i]||0})).filter(m=>m.x>0)});
    if(r.runs.length>30)r.runs.length=30;
    saveRec(r); const nt=titlesOf(r).filter(x=>!tB.includes(x));
    if(nt.length){const L=enPages[enPages.length-1]; L.text+='<br><br>🏅 称号獲得　'+nt.map(x=>'「'+x+'」').join(' ')}
  }
  S.mode='menu'; bgmDuck=1; bgm('ending');
  ['hud','dead','pause','lvl','hub'].forEach(id=>{$(id).hidden=true});
  $('ending').hidden=false; showEnPage();
}
$('btnEnNext').addEventListener('click',()=>{
  if(enIdx<enPages.length-1){enIdx++;showEnPage()}
  else{$('ending').hidden=true;toMenu()}
});

/* ---------- drawing ---------- */
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function emo(ch,x,y,size,a){ctx.globalAlpha=a==null?1:a;ctx.font=size+'px '+EMO;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,x,y);ctx.globalAlpha=1}
function hpBar(x,y,w,r,col){ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(x-w/2,y,w,5);ctx.fillStyle=col;ctx.fillRect(x-w/2,y,w*Math.max(0,r),5)}
function drawWorld(){
  const b=S.base; if(!b)return;
  ctx.globalCompositeOperation='lighter'; glow('#2ef2ff',b.x,b.y,70,.26+(b.flash>0?.35:0));
  for(const v of S.vill){if(v.st==='raid')glow('#ffb43a',v.x,v.y,44,.35+.15*Math.sin(S.clock*8))}
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  if(S.bar.on){ctx.globalCompositeOperation='lighter';glow('#5cb8ff',b.x,b.y,110,.38);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.65;ctx.strokeStyle='#8fd0ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,95,0,TAU);ctx.stroke();ctx.globalAlpha=1}
  const fl=b.flash>0&&((S.t*30)|0)%2===0;
  emo('🏰',b.x,b.y,fl?52:46,fl?.6:1);
  const r=b.hp/b.max; hpBar(b.x,b.y+34,64,r,r<.3?'#ff3d8b':'#2ef2ff');
  for(const v of S.vill){
    emo(v.st==='lost'?'🔥':'🏠',v.x,v.y,30,v.st==='lost'?.85:1);
    if(v.st==='raid'){hpBar(v.x,v.y+22,40,v.hp/v.max,'#ffb43a');if(((S.clock*3)|0)%2===0)emo('🆘',v.x,v.y-28,20)}
    if(v.st==='saved')emo('✨',v.x+16,v.y-16,16);
  }
  emo(S.area.emoji,S.hero.x,S.hero.y,22);
}
function drawGrid(){
  if(S.mode!=='menu')drawBG();
  ctx.fillStyle=vig; ctx.globalAlpha=1; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,130,255,.08)'; ctx.lineWidth=1; ctx.beginPath();
  const off=(S.clock*8)%48;
  for(let x=-off;x<W;x+=48){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let y=-off;y<H;y+=48){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.stroke();
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#07061a'; ctx.fillRect(0,0,cv.width,cv.height);
  const sh=reduceMotion?S.shake*.25:S.shake, k=DPR*SC;
  ctx.setTransform(k,0,0,k,sh?(rand()-.5)*sh*2*DPR:0,sh?(rand()-.5)*sh*2*DPR:0);
  drawGrid();
  if(S.mode==='menu'){
    ctx.globalCompositeOperation='lighter';
    for(const a of S.ambient)glow(a.col,a.x,a.y,a.s*3,a.a);
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; return;
  }
  const p=S.player;
  ctx.globalCompositeOperation='lighter';
  for(const f of S.fields){
    const a=Math.min(1,f.life/.6), pulse=1+Math.sin(S.clock*6+f.x)*.04;
    glow('#9dff4a',f.x,f.y,f.r*1.1*pulse,.38*a);

  }
  for(const g of S.gems){glow('#a98bff',g.x,g.y,10,.7);ctx.globalAlpha=1;ctx.fillStyle='#efe8ff';ctx.fillRect(g.x-2,g.y-2,4,4)}
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  drawWorld();
  for(const e of S.enemies){
    if(e.dead)continue;
    if(e.type==='tank'||e.type==='elite'||e.boss){ctx.globalCompositeOperation='lighter';glow(e.col,e.x,e.y,e.r*(e.boss?2.6:2.2),.35);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}
    const rot=e.sides===3?e.ang:S.clock*(e.sides===6?.6:.3)+e.ph;
    poly(e.x,e.y,e.r,e.sides,rot);
    ctx.fillStyle=e.flash>0?'#ffffff':e.fill; ctx.fill();
    ctx.strokeStyle=e.flash>0?'#ffffff':e.col; ctx.lineWidth=e.type==='elite'||e.boss?3:2; ctx.stroke();
    if(e.boss){emo(e.emoji,e.x,e.y,e.r*1.7,e.flash>0?.6:1)}
  }
  ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';

    ctx.globalAlpha=a; ctx.lineWidth=6*(1-pr*.5); ctx.beginPath(); ctx.arc(p.x,p.y,r.r,0,TAU); ctx.stroke();
  }
  for(const b of S.bullets){
    ctx.globalAlpha=.9; ctx.strokeStyle=b.col; ctx.lineWidth=b.r*1.1;
    ctx.beginPath(); ctx.moveTo(b.x-b.vx*.028,b.y-b.vy*.028); ctx.lineTo(b.x,b.y); ctx.stroke();
    glow(b.col,b.x,b.y,b.r*3.2,.8);
  }
  for(const b of S.bolts){
    const a=b.life/.16;
    ctx.globalAlpha=a; ctx.strokeStyle='#e8f46a'; ctx.lineWidth=2.5; ctx.beginPath();
    b.pts.forEach((q,i)=>{if(i)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1])}); ctx.stroke();
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=1; ctx.stroke();
  }
  for(const q of S.parts){const l=q.life/q.max;glow(q.col,q.x,q.y,q.size*2.8*(.4+l),Math.min(1,l*1.4))}

    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(p.x,p.y,5.5,0,TAU); ctx.fill();
    ctx.strokeStyle=p.col; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.stroke();
    if(p.ult){ctx.strokeStyle='#ffd86a'; ctx.lineWidth=2; ctx.globalAlpha=.55+.35*Math.sin(S.t*6); ctx.beginPath(); ctx.arc(p.x,p.y,p.r+6,0,TAU); ctx.stroke(); ctx.globalAlpha=blink?.45:1}
    for(let i=0;i<nb;i++){
      const a=p.bitAng+i*TAU/nb,bx=p.x+Math.cos(a)*58,by=p.y+Math.sin(a)*58;
      poly(bx,by,4.5,4,a); ctx.fillStyle='#ffffff'; ctx.fill();
    }
    /* 自機マーカー: 敵やエフェクトに埋もれても見失わない目印(画面上端では足元側に出す) */
    {

      const cy=up?p.y-p.r-20+bob:p.y+p.r+20-bob, dir=up?1:-1, w=11, h=13;
      ctx.globalAlpha=1; ctx.beginPath();
      ctx.moveTo(p.x-w,cy-h*dir); ctx.lineTo(p.x+w,cy-h*dir); ctx.lineTo(p.x,cy+h*dir); ctx.closePath();
      ctx.lineJoin='round'; ctx.lineWidth=4; ctx.strokeStyle='rgba(5,4,18,.85)'; ctx.stroke();
      ctx.fillStyle=p.col; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#ffffff'; ctx.stroke();
    }
  }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  if(ptr.active&&ptr.type!=='mouse'){
    ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ptr.ax/SC,ptr.ay/SC,64/SC,0,TAU); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(ptr.x/SC,ptr.y/SC,16/SC,0,TAU); ctx.fill();
  }
}

const hc={};
function setT(id,v){if(hc[id]!==v){hc[id]=v;$(id).textContent=v}}
function hud(){
  const p=S.player; if(!p||$('hud').hidden)return;
  $('xpFill').style.width=(p.xp/p.need*100).toFixed(1)+'%';
  $('hpFill').style.width=Math.max(0,S.base.hp/S.base.max*100).toFixed(1)+'%';

  {const bs=S.boss&&!S.boss.dead; $('bossBar').hidden=!bs; if(bs){setT('bossName',S.boss.emoji+' '+S.boss.bn); const mv=S.area.match[CHARS.indexOf(S.ch)]; setT('bossMat','相性 '+MATCH_MARK[mv]+MATCH_LBL[mv]); $('bossFill').style.width=Math.max(0,S.boss.hp/S.boss.max*100).toFixed(1)+'%'}}
   setT('vil',S.vill.filter(v=>v.st==='saved').length+'/'+S.vill.length); {const mv=S.area.match[CHARS.indexOf(S.ch)]; setT('mat',MATCH_MARK[mv]+MATCH_LBL[mv]);}
  {const w=$('wv'),is=w.children; for(let i=0;i<3;i++){const f=Math.max(0,Math.min(1,p.wv-i));is[i+1].firstChild.style.width=(f*100).toFixed(0)+'%';is[i+1].classList.toggle('full',f>=1)} w.classList.toggle('rdy',p.wv>=1); w.style.setProperty('--cy',p.col)}

}
