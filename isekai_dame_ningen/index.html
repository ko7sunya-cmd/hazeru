<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>異世界ダメ人間計画：今夜もVIPを瓢箪します!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#28323d;
    --ink-light:#e7f1fb;
    --paper:#ffffff;
    --gold:#f0b429;
    --glow:#fff6df;
    --citrus:#ff8a3d;
    --ice:#3fb8e0;
    --line: rgba(35,49,63,0.12);
    --tier0-1:#0e1b2e; --tier0-2:#1a3352;
    --tier1-1:#0e1b2e; --tier1-2:#1f3d63;
    --tier2-1:#0c1928; --tier2-2:#245e8f;
    --tier3-1:#0c1928; --tier3-2:#2b74ad;
    --tier4-1:#0c1928; --tier4-2:#f0b429;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    background: radial-gradient(circle at 20% 0%, var(--tier0-2), var(--tier0-1) 60%);
    transition: background 1.4s ease;
    overflow-x:hidden;
    position:relative;
  }
  body[data-tier="1"]{background: radial-gradient(circle at 20% 0%, var(--tier1-2), var(--tier1-1) 60%);}
  body[data-tier="2"]{background: radial-gradient(circle at 20% 0%, var(--tier2-2), var(--tier2-1) 60%);}
  body[data-tier="3"]{background: radial-gradient(circle at 20% 0%, var(--tier3-2), var(--tier3-1) 60%);}
  body[data-tier="4"]{background: radial-gradient(circle at 30% 0%, var(--tier4-2), var(--tier4-1) 55%);}

  .stars{
    position:fixed; inset:0; pointer-events:none; opacity:0.7;
    background-image:
      radial-gradient(1.8px 1.8px at 10% 20%, var(--ice), transparent),
      radial-gradient(1.8px 1.8px at 80% 10%, var(--gold), transparent),
      radial-gradient(1.3px 1.3px at 40% 60%, var(--citrus), transparent),
      radial-gradient(1.8px 1.8px at 70% 80%, var(--ice), transparent),
      radial-gradient(1.3px 1.3px at 90% 50%, var(--gold), transparent),
      radial-gradient(1.3px 1.3px at 25% 85%, var(--citrus), transparent);
    background-repeat:no-repeat;
  }

  .wrap{
    max-width:720px; margin:0 auto; padding:32px 20px 80px;
    position:relative; z-index:1;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--citrus); opacity:0.9; text-align:center; margin-bottom:6px;
  }
  h1.title{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(24px,5.6vw,36px);
    text-align:center; margin:0 0 6px;
    letter-spacing:0.02em;
    background: linear-gradient(90deg, var(--citrus), var(--gold) 55%, var(--ice));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 18px rgba(240,180,41,0.4));
  }
  .lede{
    text-align:center; font-size:13.5px; color:var(--ink-light); opacity:0.75;
    margin:0 0 34px; line-height:1.7;
  }

  /* --- select screen --- */
  .total-happiness{
    text-align:center; font-family:'JetBrains Mono',monospace; font-size:13px;
    color:var(--citrus); opacity:0.9; letter-spacing:0.05em; margin-bottom:18px;
  }
  .char-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:520px){ .char-grid{grid-template-columns:1fr;} }
  .char-card{
    background:#ffffff;
    border:1px solid var(--line); border-radius:18px;
    padding:22px 18px; text-align:center; cursor:pointer;
    box-shadow:0 10px 30px -14px rgba(4,10,20,0.65);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .char-card:hover{ transform:translateY(-4px); border-color:var(--card-color,var(--gold)); box-shadow:0 14px 30px -14px var(--card-color,var(--gold)); }
  }
  .emblem{
    width:78px; height:78px; margin:0 auto 14px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--glow-c,var(--glow)), var(--card-color,var(--gold)) 70%);
    box-shadow:0 6px 20px -6px var(--card-color,var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:26px; color:#2a1f14;
  }
  .char-card h3{ font-family:'Shippori Mincho',serif; font-size:19px; margin:0 0 4px; }
  .char-card p{ font-size:12px; opacity:0.6; margin:0 0 14px; line-height:1.6;}
  .char-progress{ font-family:'JetBrains Mono',monospace; font-size:11px; opacity:0.7; }

  .char-card.locked{
    opacity:0.55; cursor:default; filter:grayscale(0.5);
    box-shadow:none;
  }
  .char-card.locked:hover{ transform:none; border-color:var(--line); box-shadow:none; }
  .locked-emblem{
    background: radial-gradient(circle at 35% 30%, #ffffff, rgba(35,49,63,0.06) 70%);
    box-shadow:none; color:var(--ink); opacity:0.6;
  }

  .reset-save-btn{
    display:block; margin:28px auto 0; background:none; border:none;
    color:var(--ink-light); opacity:0.55; font-size:11px; font-family:'Zen Kaku Gothic New',sans-serif;
    text-decoration:underline; cursor:pointer;
  }
  @media (hover:hover) and (pointer:fine){
    .reset-save-btn:hover{ opacity:0.9; }
  }

  .zukan-btn{
    display:block; margin:26px auto 0; background:#ffffff;
    border:1px solid var(--line); color:var(--ink); opacity:0.9;
    font-size:12.5px; font-family:'Zen Kaku Gothic New',sans-serif;
    padding:10px 20px; border-radius:100px; cursor:pointer;
    box-shadow:0 8px 22px -12px rgba(4,10,20,0.5);
    transition: opacity .2s, border-color .2s;
  }
  @media (hover:hover) and (pointer:fine){
    .zukan-btn:hover{ opacity:1; border-color:var(--citrus); }
  }

  .zukan-list{ display:flex; flex-direction:column; gap:12px; margin-top:18px; }
  .zukan-card{
    border:1px solid var(--line); border-radius:16px; padding:18px 20px;
    background:#ffffff;
    box-shadow:0 2px 14px -10px rgba(35,49,63,0.15);
  }
  .zukan-card.locked{ opacity:0.5; filter:grayscale(0.6); box-shadow:none; }
  .zukan-card .zname{
    font-family:'Shippori Mincho',serif; font-weight:700; font-size:17px;
    margin-bottom:2px;
  }
  .zukan-card .zreading{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; opacity:0.55; margin-bottom:10px;
  }
  .zukan-card .zrow{ font-size:12.5px; opacity:0.8; margin-bottom:4px; line-height:1.6; }
  .zukan-card .zrow b{ color:var(--citrus); opacity:0.95; font-weight:700; }
  .zukan-card .znote{ font-size:12.5px; opacity:0.75; line-height:1.8; margin-top:8px; }

  /* --- game screen --- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; gap:12px;
  }
  .backbtn{
    background:#ffffff; border:1px solid var(--line); color:var(--ink);
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:12px;
    padding:8px 14px; border-radius:100px; cursor:pointer; opacity:0.8;
    transition:opacity .2s, border-color .2s;
  }
  @media (hover:hover) and (pointer:fine){
    .backbtn:hover{ opacity:1; border-color:var(--citrus); }
  }

  .who{ display:flex; align-items:center; gap:10px; }
  .who .dot{ width:34px; height:34px; border-radius:50%; background:var(--card-color,var(--gold)); box-shadow:0 4px 14px -3px var(--card-color,var(--gold)); flex:none; }
  .who .name{ font-family:'Shippori Mincho',serif; font-weight:700; font-size:15px; color:var(--ink-light); }
  .who .rank{ font-size:10.5px; opacity:0.75; color:var(--ink-light); font-family:'JetBrains Mono',monospace; letter-spacing:0.05em; }

  .gauge-shell{
    border:1px solid rgba(255,255,255,0.18); border-radius:100px; height:12px;
    overflow:hidden; background:rgba(255,255,255,0.08); margin-bottom:4px;
  }
  .gauge-fill{
    height:100%; border-radius:100px;
    background:linear-gradient(90deg, var(--citrus), var(--gold), #ffe9a8);
    width:0%; transition: width 1s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 0 10px 0 rgba(240,180,41,0.5);
  }
  .gauge-num{
    text-align:right; font-family:'JetBrains Mono',monospace; font-size:11px; opacity:0.8; color:var(--ink-light);
    margin-bottom:22px;
  }

  .scene{
    position:relative;
    border:1px solid var(--line);
    background:#ffffff;
    box-shadow:0 14px 40px -18px rgba(4,10,20,0.7);
    border-radius:20px; padding:26px 24px 22px;
    margin-bottom:18px;
  }
  .scene::before{
    content:""; position:absolute; top:14px; left:14px; width:16px; height:16px;
    border-top:2px solid var(--card-color,var(--gold)); border-left:2px solid var(--card-color,var(--gold));
    opacity:0.7;
  }
  .scene::after{
    content:""; position:absolute; bottom:14px; right:14px; width:16px; height:16px;
    border-bottom:2px solid var(--card-color,var(--gold)); border-right:2px solid var(--card-color,var(--gold));
    opacity:0.7;
  }
  .scene-label{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.15em;
    text-transform:uppercase; color:var(--card-color,var(--gold)); margin-bottom:10px; opacity:0.95;
    text-shadow:0 0 10px var(--card-color,var(--gold));
  }
  .scene-text{
    font-size:15.5px; line-height:1.95; white-space:pre-wrap;
  }

  .beat-fade{ animation: beatFadeIn .5s ease both; }
  @keyframes beatFadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .beat-sfx{
    display:block; text-align:center; font-family:'Shippori Mincho',serif; font-weight:700;
    font-size:26px; letter-spacing:0.25em; margin:18px 0; color:var(--card-color,var(--gold));
    text-shadow:0 2px 10px rgba(35,49,63,0.12);
  }
  .flash-overlay{
    position:fixed; inset:0; pointer-events:none; z-index:40;
    background:var(--card-glow, #fff3d0); opacity:0;
  }
  .flash-overlay.play{ animation: climaxFlash .55s ease-out; }
  @keyframes climaxFlash{
    0%{ opacity:0; } 12%{ opacity:0.65; } 100%{ opacity:0; }
  }
  .beat-continue-btn{
    margin-top:14px; align-self:center;
    background:#ffffff; border:1px solid var(--card-color,var(--gold));
    color:var(--card-color,var(--gold)); padding:10px 20px; border-radius:100px;
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:13px; font-weight:700; cursor:pointer;
    transition: background .2s;
  }
  @media (hover:hover) and (pointer:fine){
    .beat-continue-btn:hover{ background:rgba(35,49,63,0.05); }
  }

  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice-btn{
    position:relative; overflow:hidden;
    text-align:left; padding:15px 18px; border-radius:14px;
    border:1px solid var(--line); background:#fff7e6;
    color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; font-size:14px;
    cursor:pointer; transition: border-color .2s, background .2s, transform .15s, box-shadow .2s;
    line-height:1.5;
    box-shadow: 0 0 0 1px rgba(63,184,224,0.14), 0 3px 14px -9px rgba(63,184,224,0.45);
  }
  .choice-btn::after{
    content:"";
    position:absolute; top:0; left:-60%; width:35%; height:100%;
    background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.85) 45%, transparent 100%);
    transform: skewX(-20deg);
    animation: choiceShine 2.4s ease 0.15s 1 both;
    pointer-events:none;
  }
  @keyframes choiceShine{
    0%{ left:-60%; opacity:0; }
    18%{ opacity:0.9; }
    55%{ opacity:0.4; }
    100%{ left:130%; opacity:0; }
  }
  @media (hover:hover) and (pointer:fine){
    .choice-btn:hover{
      border-color:var(--card-color,var(--gold)); background:#ffffff;
      box-shadow: 0 0 0 1px rgba(63,184,224,0.3), 0 4px 16px -10px rgba(35,49,63,0.2), 0 0 16px -4px rgba(63,184,224,0.5);
      transform:translateX(2px);
    }
  }
  .choice-btn:active{
    border-color:var(--card-color,var(--gold)); background:#ffffff;
    box-shadow: 0 0 0 1px rgba(63,184,224,0.3), 0 0 16px -4px rgba(63,184,224,0.5);
    transform:scale(0.98);
  }
  .choice-btn .delta-hint{
    display:block; margin-top:5px; font-family:'JetBrains Mono',monospace; font-size:10.5px; opacity:0.5;
  }
  .continue-btn{
    margin-top:4px; align-self:flex-end;
    background:linear-gradient(90deg, var(--citrus), var(--gold));
    color:#2a1f0a; border:none; padding:12px 22px; border-radius:100px;
    font-weight:700; font-size:13px; cursor:pointer;
    box-shadow:0 8px 20px -10px rgba(240,138,61,0.55);
  }

  .burst-layer{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:50;
  }
  .burst{
    font-family:'JetBrains Mono',monospace; font-weight:800;
    font-size:48px;
    background:linear-gradient(90deg, var(--citrus), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 22px rgba(240,180,41,0.55));
    opacity:0; transform:scale(0.4);
  }
  .burst.play{ animation: burstpop 1.5s cubic-bezier(.2,1.4,.3,1) forwards; }
  @keyframes burstpop{
    0%{ opacity:0; transform:scale(0.3) translateY(20px);}
    18%{ opacity:1; transform:scale(1.15) translateY(0);}
    30%{ transform:scale(1);}
    75%{ opacity:1; }
    100%{ opacity:0; transform:scale(1) translateY(-30px);}
  }
  .rankup-banner{
    position:fixed; left:0; right:0; top:26%; text-align:center; z-index:51;
    pointer-events:none; opacity:0;
  }
  .rankup-banner.play{ animation: bannerslide 2.2s ease forwards; }
  @keyframes bannerslide{
    0%{ opacity:0; transform:translateY(-14px) scale(0.96);}
    14%{ opacity:1; transform:translateY(0) scale(1);}
    80%{ opacity:1;}
    100%{ opacity:0; transform:translateY(-6px) scale(1);}
  }
  .rankup-banner .lbl{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:0.2em; color:var(--glow); background:rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    border:1px solid var(--gold); padding:5px 14px; border-radius:100px; margin-bottom:10px;
  }
  .rankup-banner .big{
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:clamp(26px,6.6vw,42px);
    background:linear-gradient(90deg, var(--citrus), var(--gold), #d98f0f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 20px rgba(240,180,41,0.5));
  }

  .ending{
    text-align:center; padding:40px 10px;
  }
  .ending h2{ font-family:'Shippori Mincho',serif; font-size:24px; margin-bottom:10px; }
  .ending p{ font-size:14px; opacity:0.75; line-height:1.9; max-width:480px; margin:0 auto 22px; }
  .ending .final-num{
    font-family:'JetBrains Mono',monospace; font-size:38px; color:var(--citrus); margin-bottom:6px;
  }
  #screen-ending.is-max .scene{
    background: linear-gradient(160deg, #142744, #0c1928 65%);
    border-color: var(--card-color, var(--gold));
    box-shadow:0 20px 60px -20px var(--card-color, var(--gold)), inset 0 0 40px -18px var(--card-color, var(--gold));
  }
  #screen-ending.is-max #end-label{
    color: var(--glow);
    font-weight:700;
    text-shadow:0 0 14px var(--card-color, var(--gold));
    opacity:1;
  }
  #screen-ending.is-max #end-title{
    background: linear-gradient(90deg, var(--ice), var(--card-color,var(--gold)), var(--citrus));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 18px var(--card-color, var(--gold)));
  }
  #screen-ending.is-max #end-num{
    color:var(--citrus); text-shadow:0 0 16px rgba(255,138,61,0.6);
  }
  #screen-ending.is-max #end-text{
    color:var(--ink-light); opacity:0.92;
  }

  .finale-title{
    font-family:'Shippori Mincho',serif; font-weight:800;
    font-size:clamp(24px,6vw,32px); text-align:center; margin:2px 0 18px;
    background: linear-gradient(90deg, #ff8a3d, #f0b429, #ffb454, #3fb8e0, #2f8fd8);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .finale-intro{
    text-align:center; font-size:14px; opacity:0.85; line-height:1.9;
    max-width:520px; margin:0 auto 28px; color:var(--ink-light);
  }
  .finale-vignettes{
    display:flex; flex-direction:column; gap:14px; margin-bottom:30px;
  }
  .finale-card{
    border:1px solid var(--line); border-left:3px solid var(--vc, var(--gold));
    border-radius:14px; padding:16px 18px;
    background:#ffffff;
    box-shadow:0 10px 30px -16px rgba(4,10,20,0.6);
  }
  .finale-card .fname{
    font-family:'Shippori Mincho',serif; font-weight:700; font-size:14px;
    color:var(--vc, var(--gold)); margin-bottom:6px;
  }
  .finale-card .ftext{
    font-size:13.5px; line-height:1.85; opacity:0.85;
  }
  .finale-closing{
    text-align:center; font-size:14px; line-height:2.1; opacity:0.9; color:var(--ink-light);
    max-width:480px; margin:0 auto 26px; white-space:pre-wrap;
  }

  .hidden{ display:none !important; }

  .mute-btn{
    position:fixed; top:16px; right:16px; z-index:60;
    width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.14);
    color:var(--glow); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(8px);
    box-shadow:0 6px 18px -8px rgba(4,10,20,0.5);
    transition: border-color .2s, transform .15s;
  }
  @media (hover:hover) and (pointer:fine){
    .mute-btn:hover{ border-color:var(--gold); transform:scale(1.06); }
  }

  #screen-title{
    min-height:72vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    cursor:pointer;
  }
  #screen-title .lede{ max-width:440px; }
  .tap-start{
    margin-top:46px; display:flex; flex-direction:column;
    align-items:center; gap:14px;
  }
  .tap-circle{
    width:64px; height:64px; border-radius:50%;
    border:1px solid var(--gold);
    background:#ffffff;
    box-shadow:0 6px 20px -10px rgba(240,180,41,0.4);
    display:flex; align-items:center; justify-content:center;
    color:var(--citrus); font-size:19px; padding-left:4px;
    animation: pulseRing 2.2s ease-in-out infinite;
  }
  @keyframes pulseRing{
    0%,100%{ box-shadow:0 0 0 0 rgba(240,180,41,0.35); transform:scale(1); }
    50%{ box-shadow:0 0 0 16px rgba(240,180,41,0); transform:scale(1.06); }
  }
  .tap-label{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:0.3em; color:var(--citrus); opacity:0.9;
  }

  /* --- ズケーン(おもてなしメニュー図鑑)画面の背景: 爽やかな青空とシトラスの泡 --- */
  #screen-zukan{ background:#eaf7ff; }
  #screen-zukan .icebg{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  #screen-zukan .icebg .base{
    position:absolute; inset:-10%;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(63,184,224,0.22), transparent 50%),
      radial-gradient(ellipse at 80% 75%, rgba(240,180,41,0.16), transparent 55%),
      linear-gradient(160deg, #f5fbff 0%, #ffffff 55%, #fff7e6 100%);
  }
  #screen-zukan .bubble{
    position:absolute; border-radius:50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95), rgba(63,184,224,0.28) 65%, transparent 74%);
    box-shadow:0 2px 8px -2px rgba(63,184,224,0.25);
    animation: bubbleFloat var(--dur,9s) ease-in-out infinite;
    animation-delay: var(--delay,0s);
    opacity:var(--op,0.6);
  }
  @keyframes bubbleFloat{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-18px) scale(1.08); }
  }
  #screen-zukan .zukan-card{
    background:rgba(255,255,255,0.82);
    border:1px solid var(--line);
    backdrop-filter: blur(6px);
    position:relative; z-index:2;
  }
  #screen-zukan .eyebrow, #screen-zukan .title, #screen-zukan #zukan-progress, #screen-zukan .backbtn{
    position:relative; z-index:2;
  }
  #screen-zukan #zukan-progress{ color:var(--ink); opacity:0.75; }

let state = { charKey:null, affection:{}, route:{}, clearedRoutes:{}, characterTotal:{}, eventIndex:0, awaitingContinue:false, discoveredCelestials:{}, beatIndex:0, inBeatMode:false };
Object.keys(DATA).forEach(k => { state.affection[k] = 0; state.route[k] = null; state.clearedRoutes[k] = {}; state.characterTotal[k] = 0; });

/* --- セーブデータ(localStorage) --- */
const SAVE_KEY = 'isekai_dame_ningen_save_v1';
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data.clearedRoutes){
      Object.keys(data.clearedRoutes).forEach(k=>{ if(state.clearedRoutes[k]){ Object.assign(state.clearedRoutes[k], data.clearedRoutes[k]); } });
    }
    if(data.characterTotal){
      Object.keys(data.characterTotal).forEach(k=>{ if(k in state.characterTotal){ state.characterTotal[k] = data.characterTotal[k]; } });
    }
    if(data.discoveredCelestials){
      Object.assign(state.discoveredCelestials, data.discoveredCelestials);
    }
  }catch(e){ console.warn('セーブデータの読み込みに失敗しました', e); }
}
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      clearedRoutes: state.clearedRoutes,
      characterTotal: state.characterTotal,
      discoveredCelestials: state.discoveredCelestials
    }));
  }catch(e){ console.warn('セーブデータの保存に失敗しました', e); }
}
function resetSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  try{ localStorage.removeItem('dame_ningen_keikaku_complete'); }catch(e){}
  Object.keys(DATA).forEach(k => { state.clearedRoutes[k] = {}; state.characterTotal[k] = 0; });
  state.discoveredCelestials = {};
  renderSelect();
}
loadSave();

/* --- 解放システム(累計堕落ポイントによるゲスト解放) ---
   tier:1は常時解放。ゲストを増やす場合はここに閾値を追加すること。 */
const TIER_THRESHOLDS = { 2: 5000 };
function grandTotal(){
  return Object.values(state.characterTotal).reduce((a,b)=>a+b, 0);
}
function isCharUnlocked(key){
  const t = DATA[key].tier || 1;
  if(t <= 1) return true;
  const need = TIER_THRESHOLDS[t];
  return need === undefined ? true : grandTotal() >= need;
}

/* --- 特別編(全ゲスト読了で解放されるエピローグ集) --- */
function clearedRouteCount(){
  return Object.keys(DATA).reduce((n,k)=>{
    const c = state.clearedRoutes[k] || {};
    return n + (c.A ? 1 : 0) + (c.B ? 1 : 0);
  }, 0);
}
function isFinaleUnlocked(){
  return Object.keys(DATA).every(k=>{
    const c = state.clearedRoutes[k] || {};
    return c.A && c.B;
  });
}

  viola:"城の見張り塔に立つヴィオラは、今日も一切の表情を崩さない。国最強の剣士としての威厳は、以前と変わらず健在だ。ただ、非番の夜になると、こっそりマイクを握りしめに来ては、誰も知らないもう一つの人格を全開にしているらしい。『……剣聖のあーしも、素のあーしも、どっちも本当のあーしだから』",
  elphi:"大書庫の隅、いつしか『エルフィリア専用棚』ができていた。歴史書の合間に、色とりどりの背表紙が並んでいる。司書たちは首を傾げているが、本人は気にも留めない。『……次はどんな物語を読ませてくれるのかしら』本を抱きしめる横顔は、以前よりずっと生き生きしている。",
  eleonora:"隣国の貴婦人たちを招いた夜会で、エレオノーラの肌と髪の輝きは、今日も周囲を沈黙させている。『……これはちょっとした「神のサロン」の秘密ですの』と優越感に浸る王妃は、定期的にこっそりこの部屋に瓢箪されにきているらしい。鏡を覗き込む横顔は、以前よりずっと明るい。",
  lumina:"祈祷堂の隅、いつしか小さなアロマキャンドルが灯るようになっていた。祈祷の合間、ルミナはそっと目を閉じ、その香りに浸る時間を作っている。教会の誰も、彼女が『癒される側』の顔を知らないままだ。『……癒しは、与えるだけのものじゃなかったんですね』",
  rainhardt:"ハイドランジア王国の執務室、いつしか小さなゲーム機が置かれるようになっていた。政務の合間、ラインハルトはこっそり対戦相手を求めてこの部屋に瓢箪されにきているらしい。『……エイセレブに勝ちたいんじゃない。ただ、あの一戦の続きがしたいだけだ』コントローラーを握る横顔は、以前よりずっと晴れやかだ。",
  mireille:"ハイドランジア王国の魔導研究塔、いつしか机の端にお揃いのブレスレットが置かれるようになっていた。研究の合間、ミレイユはそっとそれを眺め、微笑む時間を作っている。『……敵国の剣聖と友人になるとは、我ながら理解し難いですね』そう呟く声には、確かな親しみが滲んでいた。",
  lily:"リリィの部屋には、あの夜もらったゲーム機が大切に飾られている。毎日少しずつ練習を重ね、いつの間にか誰よりも上手にボタンを操るようになっていた。『いつか、お兄ちゃんともう一回勝負するんだ!』クマのぬいぐるみを抱きしめながら、リリィは今日も無邪気に笑っている。",
  chancellors:"エイセレブとハイドランジア、両国の財務会議のたびに、バルドゥールとゲアハルトはこっそり示し合わせて『視察』と称し、この部屋に瓢箪されにきているらしい。将棋盤とチェス盤を並べる机の端には、あの夜もらった小さな盆栽が二鉢、几帳面に手入れされて並んでいる。『……数字馬鹿同士、案外いいコンビだな』",
  elvira:"エイセレブとハイドランジア、両国は正式な同盟条約を締結した。祝賀の宴には、あの夜出会った顔ぶれが揃って参列している。『……あんなに仲が悪かったはずなのに、どうしてこうなったのかしら』エルヴィラは今でも時々そう呟くが、その声はいつも笑っている。"
};

  box.innerHTML = '';

function rankFor(v){
  let r = RANKS[0], idx = 0;
  RANKS.forEach((rk,i)=>{ if(v>=rk.min){ r=rk; idx=i; } });
  return {name:r.name, idx};
}
function tierFor(v){ return rankFor(v).idx; }

/* --- 隠しジェスチャー: ビート再生中のみ、左右フリックで前後に移動できる --- */
(function(){
  let touchStartX = null, touchStartY = null;
  const gameScreen = document.getElementById('screen-game');
  gameScreen.addEventListener('touchstart', (e)=>{
    if(!state.inBeatMode) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  gameScreen.addEventListener('touchend', (e)=>{
    if(!state.inBeatMode || touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    touchStartX = null;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const events = getEventList(state.charKey);
    const ev = events[state.eventIndex];
    if(!ev.beats) return;
    if(dx > 0){
      if(state.beatIndex > 0){ state.beatIndex--; renderBeat(ev); }
    } else {
      if(state.beatIndex < ev.beats.length - 1){ state.beatIndex++; renderBeat(ev); }
      else { renderChoiceButtons(ev); }
    }
  }, {passive:true});
})();

function getEventList(key){
  const c = DATA[key];
  if(c.routes){
    const r = state.route[key];
    if(r && c.routes[r]){ return [c.event1, ...c.routes[r].events]; }
    return [c.event1];
  }
  return c.events;
}
function getEpilogueText(key){
  const c = DATA[key];
  if(c.routes && state.route[key] && c.routes[state.route[key]]){
    return c.routes[state.route[key]].epilogueText;
  }
  return c.epilogueText;
}
function routeKeyFor(key){
  return DATA[key].routes ? (state.route[key] || 'A') : 'main';
}

function setCardVars(el, color, glow){
  el.style.setProperty('--card-color', color);
  el.style.setProperty('--glow-c', glow);
}

/* --- BGM engine(音声ファイルは未同梱。再生に失敗しても静かに無視される) --- */
const CHAR_KEYS = Object.keys(DATA);
function charBgmFile(key){
  const idx = CHAR_KEYS.indexOf(key) + 1;
  return 'character_bgm' + String(idx).padStart(2,'0') + '.mp3';
}
const bgm = document.getElementById('bgm');
const muteBtn = document.getElementById('mute-btn');
let bgmMuted = false;
let bgmFadeTimer = null;
const BGM_VOLUME = 0.55;

function fadeBgmTo(target, ms){
  clearInterval(bgmFadeTimer);
  const start = bgm.volume;
  const steps = 20;
  let i = 0;
  bgmFadeTimer = setInterval(()=>{
    i++;
    bgm.volume = Math.max(0, Math.min(1, start + (target-start) * (i/steps)));
    if(i>=steps){ clearInterval(bgmFadeTimer); }
  }, ms/steps);
}

function playBgm(src){
  if(bgm.getAttribute('data-src') === src){ return; }
  bgm.setAttribute('data-src', src);
  const doSwitch = ()=>{
    bgm.src = src;
    bgm.currentTime = 0;
    bgm.volume = 0;
    bgm.muted = bgmMuted;
    bgm.play().then(()=>{ fadeBgmTo(bgmMuted ? 0 : BGM_VOLUME, 900); }).catch(()=>{ /* ユーザー操作待ち、または音源未同梱 */ });
  };
  if(bgm.src && !bgm.paused){
    fadeBgmTo(0, 400);
    setTimeout(doSwitch, 400);
  } else {
    doSwitch();
  }
}

muteBtn.addEventListener('click', ()=>{
  bgmMuted = !bgmMuted;
  muteBtn.textContent = bgmMuted ? '🔇' : '🔊';
  bgm.muted = bgmMuted;
  fadeBgmTo(bgmMuted ? 0 : BGM_VOLUME, 300);
  if(!bgmMuted && bgm.paused){ bgm.play().catch(()=>{}); }
});

function progressLabel(key){
  const c = DATA[key];
  const cleared = state.clearedRoutes[key] || {};
  const total = state.characterTotal[key] || 0;
  if(c.routes){
    const a = cleared.A ? '既読' : '未読';
    const b = cleared.B ? '既読' : '未読';
    return `累計堕落ポイント ${total}　|　ルートA ${a} / ルートB ${b}`;
  }
  return `累計堕落ポイント ${total}　|　${cleared.main ? '既読' : '未読'}`;
}

/* --- 次回予告枠(未実装ゲストのプレースホルダー、クリック不可) --- */
const COMING_SOON = [];

function renderSelect(){
  window.scrollTo(0, 0);
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';
  const gt = grandTotal();
  Object.keys(DATA).forEach(key=>{
    const c = DATA[key];
    const card = document.createElement('div');
    const unlocked = isCharUnlocked(key);
    if(!unlocked){
      card.className = 'char-card locked';
      const need = TIER_THRESHOLDS[c.tier];
      card.innerHTML = `
        <div class="emblem locked-emblem">🔒</div>
        <h3>？？？</h3>
        <p>総堕落ポイント ${need} で解放</p>
        <div class="char-progress">現在の総堕落ポイント ${gt} / ${need}</div>
      `;
      grid.appendChild(card);
      return;
    }
    card.className = 'char-card';
    setCardVars(card, c.color, c.glow);
    card.innerHTML = `
      <div class="emblem">${c.emblem}</div>
      <h3>${c.name}</h3>
      <p>${c.subtitle}</p>
      <div class="char-progress">${progressLabel(key)}</div>
    `;
    card.addEventListener('click', ()=> startGame(key));
    grid.appendChild(card);
  });

  COMING_SOON.forEach(cs=>{
    const card = document.createElement('div');
    card.className = 'char-card locked';
    card.innerHTML = `
      <div class="emblem locked-emblem">🔒</div>
      <h3>${cs.name}</h3>
      <p>${cs.desc}</p>
      <div class="char-progress">近日実装予定</div>
    `;
    grid.appendChild(card);
  });

  const finaleCard = document.createElement('div');
  const finaleUnlocked = isFinaleUnlocked();
  const doneCount = clearedRouteCount();
  const totalRoutes = Object.keys(DATA).length * 2;
  if(finaleUnlocked){
    finaleCard.className = 'char-card finale-card-select';
    finaleCard.style.setProperty('--card-color', '#ffce6b');
    finaleCard.style.setProperty('--glow-c', '#fff3d0');
    finaleCard.innerHTML = `
      <div class="emblem">✦</div>
      <h3>特別編</h3>
      <p>それからの日々 — ゲストのエピローグ集</p>
      <div class="char-progress">解放済み</div>
    `;
    finaleCard.addEventListener('click', showFinale);
  } else {
    finaleCard.className = 'char-card locked';
    finaleCard.innerHTML = `
      <div class="emblem locked-emblem">🔒</div>
      <h3>特別編</h3>
      <p>全ゲスト、両ルートを読了すると解放</p>
      <div class="char-progress">読了 ${doneCount} / ${totalRoutes}</div>
    `;
  }
  grid.appendChild(finaleCard);

  document.getElementById('total-happiness').textContent = `総堕落ポイント: ${gt}`;
  document.getElementById('screen-select').classList.remove('hidden');
  document.getElementById('screen-game').classList.add('hidden');
  document.getElementById('screen-ending').classList.add('hidden');
  document.getElementById('screen-finale').classList.add('hidden');
  document.getElementById('screen-zukan').classList.add('hidden');
  playBgm('select_bgm.mp3');
}

function startGame(key){
  window.scrollTo(0, 0);
  state.charKey = key;
  state.eventIndex = 0;
  state.affection[key] = 0;
  state.route[key] = null;
  document.getElementById('screen-select').classList.add('hidden');
  document.getElementById('screen-ending').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');
  const c = DATA[key];
  setCardVars(document.getElementById('screen-game'), c.color, c.glow);
  document.getElementById('who-dot').style.background = c.color;
  document.getElementById('who-dot').style.boxShadow = '0 0 16px -2px ' + c.color;
  document.getElementById('who-name').textContent = c.name;
  document.body.setAttribute('data-tier', tierFor(state.affection[key]));
  playBgm(charBgmFile(key));
  renderEvent();
}

function updateGauge(){
  const key = state.charKey;
  const aff = state.affection[key];
  const rk = rankFor(aff);
  document.getElementById('who-rank').textContent = '堕落ランク: ' + rk.name;
  document.getElementById('gauge-num').textContent = '堕落ポイント ' + aff;
  const nextRank = RANKS[rk.idx+1];
  const span = nextRank ? (nextRank.min - RANKS[rk.idx].min) : 60;
  const within = nextRank ? (aff - RANKS[rk.idx].min) : span;
  const pct = nextRank ? Math.min(100, Math.round((within/span)*100)) : 100;
  document.getElementById('gauge-fill').style.width = pct + '%';
}

/* シーン本文が切り替わるたびに、本文の先頭が見える位置までスクロールし直す。
   前のシーンで選択肢ボタンが画面下部にあった場合、スクロール位置がそのまま
   残ってしまい、新しい本文が下から始まっているように見えるのを防ぐため。 */
function scrollSceneToTop(){
  const scene = document.querySelector('#screen-game .scene');
  if(!scene) return;
  requestAnimationFrame(()=>{
    scene.scrollIntoView({ behavior:'auto', block:'start' });
  });
}

function renderEvent(){
  const key = state.charKey;
  const events = getEventList(key);
  const ev = events[state.eventIndex];
  document.getElementById('scene-label').textContent = ev.label;
  if(ev.celestialId && !state.discoveredCelestials[ev.celestialId]){
    state.discoveredCelestials[ev.celestialId] = true;
    saveGame();
  }
  updateGauge();

  if(ev.beats && ev.beats.length){
    state.beatIndex = 0;
    renderBeat(ev);
  } else {
    state.inBeatMode = false;
    document.getElementById('scene-text').textContent = ev.text;
    renderChoiceButtons(ev);
  }
  scrollSceneToTop();
}

function renderBeat(ev){
  state.inBeatMode = true;
  const beat = ev.beats[state.beatIndex];
  const textEl = document.getElementById('scene-text');
  textEl.innerHTML = '';
  const span = document.createElement('div');
  span.className = 'beat-fade' + (beat.type === 'sfx' ? ' beat-sfx' : '');
  span.textContent = beat.text;
  textEl.appendChild(span);

  if(beat.climax){
    const flash = document.getElementById('flash-overlay');
    flash.classList.remove('play'); void flash.offsetWidth; flash.classList.add('play');
  }

  const box = document.getElementById('choices');
  box.innerHTML = '';
  const isLast = state.beatIndex === ev.beats.length - 1;
  const btn = document.createElement('button');
  btn.className = 'beat-continue-btn';
  btn.textContent = '続きを読む →';
  btn.addEventListener('click', ()=>{
    if(isLast){ renderChoiceButtons(ev); }
    else { state.beatIndex++; renderBeat(ev); }
    scrollSceneToTop();
  });
  box.appendChild(btn);
  scrollSceneToTop();
}

function renderChoiceButtons(ev){
  state.inBeatMode = false;
  const box = document.getElementById('choices');
  box.innerHTML = '';
  ev.choices.forEach(ch=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `${ch.label}<span class="delta-hint">選択すると堕落ポイントが変化します</span>`;
    btn.addEventListener('click', ()=> pickChoice(ev, ch));
    box.appendChild(btn);
  });
}

function pickChoice(ev, ch){
  state.inBeatMode = false;
  const key = state.charKey;
  if(ch.route){ state.route[key] = ch.route; }
  const before = state.affection[key];
  const beforeRank = rankFor(before);
  state.affection[key] = before + ch.delta;
  const after = state.affection[key];
  const afterRank = rankFor(after);

  document.getElementById('scene-text').textContent = ch.result;
  const box = document.getElementById('choices');
  box.innerHTML = '';
  const cont = document.createElement('button');
  cont.className = 'continue-btn';
  cont.textContent = ev.final ? 'エンディングへ →' : '次へ →';
  cont.addEventListener('click', ()=>{
    if(ev.final){ showEnding(); }
    else { state.eventIndex++; renderEvent(); }
  });
  box.appendChild(cont);

  updateGauge();
  document.body.setAttribute('data-tier', afterRank.idx);
  playBurst(ch.delta, afterRank.idx > beforeRank.idx ? afterRank.name : null);
  scrollSceneToTop();
}

function playBurst(delta, rankUpName){
  const burst = document.getElementById('burst');
  burst.textContent = '+' + delta + ' 堕落ポイント';
  burst.classList.remove('play'); void burst.offsetWidth; burst.classList.add('play');

  if(rankUpName){
    const banner = document.getElementById('rankup-banner');
    document.getElementById('rankup-text').textContent = rankUpName;
    banner.classList.remove('play'); void banner.offsetWidth; banner.classList.add('play');
  }
}

function showEnding(){
  window.scrollTo(0, 0);
  const key = state.charKey;
  const c = DATA[key];
  const events = getEventList(key);
  const ev = events[events.length-1];
  const aff = state.affection[key];
  const rk = rankFor(aff);
  const isMax = rk.idx === RANKS.length - 1;
  state.clearedRoutes[key][routeKeyFor(key)] = true;
  state.characterTotal[key] = (state.characterTotal[key] || 0) + aff;
  saveGame();
  if(isFinaleUnlocked()){
    try{ localStorage.setItem('dame_ningen_keikaku_complete', '1'); }catch(e){}
  }
  document.getElementById('screen-game').classList.add('hidden');
  document.getElementById('screen-ending').classList.remove('hidden');
  setCardVars(document.getElementById('screen-ending'), c.color, c.glow);
  const routeTag = c.routes ? `【${c.routes[state.route[key]].routeLabel}】` : '';
  document.getElementById('end-label').textContent = (isMax ? 'TRUE EPILOGUE — 堕落度MAX到達 ' : 'EPILOGUE ') + routeTag;
  document.getElementById('end-title').textContent = c.name + ' — ' + rk.name;
  document.getElementById('end-num').textContent = `今回の堕落ポイント +${aff} ・ 累計 ${state.characterTotal[key]}`;
  document.getElementById('end-text').textContent = isMax ? getEpilogueText(key) : ev.endingText;
  const box = document.getElementById('screen-ending');
  box.classList.toggle('is-max', isMax);
  if(isMax){
    const banner = document.getElementById('rankup-banner');
    document.getElementById('rankup-text').textContent = '堕落度MAX — TRUE EPILOGUE';
    banner.classList.remove('play'); void banner.offsetWidth; banner.classList.add('play');
  }
}

document.getElementById('btn-back').addEventListener('click', renderSelect);
document.getElementById('btn-ending-back').addEventListener('click', renderSelect);
document.getElementById('btn-finale-back').addEventListener('click', renderSelect);
document.getElementById('btn-reset-save').addEventListener('click', ()=>{
  if(confirm('セーブデータ(既読状態・累計堕落ポイント)を全て消去します。よろしいですか?')){
    resetSave();
  }
});

document.getElementById('screen-title').addEventListener('click', ()=>{
  document.getElementById('screen-title').classList.add('hidden');
  renderSelect();
});
</script>
