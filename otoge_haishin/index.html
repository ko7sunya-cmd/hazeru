<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音ゲープロトタイプ</title>
<style>
  @property --bg1{syntax:'<color>';inherits:true;initial-value:#1d1a2e;}
  @property --bg2{syntax:'<color>';inherits:true;initial-value:#3a2a4a;}
  :root{
    transition:--bg1 .9s ease,--bg2 .9s ease;
    --acc:#f0c060; --bg1:#1d1a2e; --bg2:#3a2a4a; --ink:#f6efe0; --gold:#f0c060; --rose:#ef8fa5; --blue:#6fb5f0;
    --line:rgba(246,239,224,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    color:var(--ink);
    background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg1) 65%);
    overflow:hidden; touch-action:manipulation; user-select:none;-webkit-user-select:none;
  }
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;}
  .screen.on{display:flex;}
  @keyframes shine{to{background-position:100% 0;}}
  h1{font-size:clamp(24px,7vw,34px);margin:0 0 8px;background:linear-gradient(90deg,#ffe3a3,var(--gold),var(--rose),#c9b2ff,#8cc8ff,#ffe3a3);background-size:220% 100%;animation:shine 9s ease-in-out infinite alternate;-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{opacity:.7;font-size:13px;line-height:1.8;margin:0 0 22px;}
  .big-btn{border:none;border-radius:100px;padding:14px 34px;font-size:16px;font-weight:700;color:#2a1a2a;background:linear-gradient(90deg,var(--gold),var(--rose));box-shadow:0 8px 22px -8px var(--gold);cursor:pointer;}
  .ghost-btn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:100px;padding:10px 22px;font-size:13px;opacity:.8;cursor:pointer;margin-top:12px;}
  .settings{margin-top:26px;width:min(340px,90%);font-size:12px;opacity:.85;text-align:left;border-top:1px solid var(--line);padding-top:14px;}
  .settings label{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:10px;}
  .settings input[type=number]{width:80px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px;text-align:right;}
  .settings input[type=range]{flex:1;}
  .world{position:absolute;top:10px;left:14px;font-size:12px;opacity:.75;z-index:5;}

  /* song select */
  #start{justify-content:flex-start;overflow-y:auto;padding:30px 16px 28px;}
  details.howto{width:min(400px,calc(100% - 28px));text-align:left;font-size:12.5px;line-height:1.7;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);padding:8px 14px;margin:0 0 12px;}
  details.howto summary{cursor:pointer;font-size:12px;letter-spacing:.12em;color:var(--gold);}
  details.howto[open] summary{margin-bottom:4px;}
  .howto .ht2{opacity:.65;font-size:11.5px;margin-top:4px;}
  .howto b{color:var(--gold);font-weight:700;}
  #bnMute{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:15px;cursor:pointer;}
  #songList{width:min(400px,calc(100% - 28px));display:flex;flex-direction:column;gap:10px;margin:0 0 18px;}
  .song{width:100%;text-align:left;border-radius:5px 12px 12px 5px;background:linear-gradient(90deg,var(--c) 0,var(--c) 64px,#e9e3dd 64px,#f7f3ef 78px,#f7f3ef 100%);color:#3a2f3a;position:relative;box-shadow:0 5px 12px -7px rgba(0,0,0,.7);transition:transform .22s,box-shadow .22s;}
  .song .ico{position:absolute;left:0;top:0;width:64px;height:64px;border-radius:5px 0 0 5px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px;color:rgba(58,47,58,.45);}
  .song .ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .song-head{padding:12px 56px 12px 78px;min-height:64px;cursor:pointer;}
  .song-head:active{opacity:.85;}
  .song.sel{transform:translateX(12px);box-shadow:0 10px 22px -8px rgba(0,0,0,.75),0 0 0 3px var(--c);}
  .song .ttl{font-size:16px;font-weight:700;}
  .song .meta{font-size:11px;color:#7a6c78;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;}
  .song .tag{color:#c0507a;}
  .song .rk{position:absolute;right:16px;top:9px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-weight:900;font-style:italic;font-size:40px;line-height:1;color:var(--rc);text-shadow:2px 0 #3a2f3a,-2px 0 #3a2f3a,0 2px #3a2f3a,0 -2px #3a2f3a,1.5px 1.5px #3a2f3a,-1.5px 1.5px #3a2f3a,1.5px -1.5px #3a2f3a,-1.5px -1.5px #3a2f3a,0 0 12px var(--rc);}
  .song .rk{isolation:isolate;}
  .song .rk-SS{width:66px;right:10px;font-size:34px;letter-spacing:-3px;color:#ffe45c;animation:sglow 1.6s ease-in-out infinite alternate;}
  .song .rk-SS::before{content:'';position:absolute;z-index:-1;inset:-4px -2px;border-radius:50%;background:conic-gradient(#ff6b6b,#ffd84d,#7dff9b,#6bd5ff,#b58cff,#ff6bd5,#ff6b6b);filter:blur(9px);opacity:.75;animation:spin 3s linear infinite;}
  .song .rk-SS::after{content:'✦';position:absolute;right:-4px;top:-3px;color:#fff;font-style:normal;font-size:14px;text-shadow:0 0 6px #ffb800;animation:twinkle 1.4s ease-in-out infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .song .rk-S{font-size:46px;color:#ffe066;animation:sglow 1.8s ease-in-out infinite alternate;}
  .song .rk-S::before,.song .rk-S::after{content:'✦';position:absolute;color:#ffd84d;font-style:normal;font-size:15px;text-shadow:0 0 6px #ffb800,0 0 2px #fff;animation:twinkle 1.6s ease-in-out infinite;}
  .song .rk-S::before{left:-6px;top:-2px;}
  .song .rk-S::after{right:-8px;bottom:-1px;font-size:11px;animation-delay:.8s;}
  .song .rk-A::after{content:'✿';position:absolute;right:-6px;top:-4px;font-style:normal;font-size:15px;color:#ffb7c9;text-shadow:0 0 3px #3a2f3a;animation:petal 3s ease-in-out infinite;}
  .song .rk-B::after{content:'✧';position:absolute;right:-6px;top:-2px;font-style:normal;font-size:14px;color:#a5dcff;text-shadow:0 0 3px #3a2f3a;animation:twinkle 2.4s ease-in-out infinite;}
  @keyframes sglow{from{filter:drop-shadow(0 0 2px #ffcc33);}to{filter:drop-shadow(0 0 9px #ffb000);}}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.5) rotate(0);}50%{opacity:1;transform:scale(1.15) rotate(25deg);}}
  @keyframes petal{0%,100%{transform:translate(0,0) rotate(0);opacity:.5;}50%{transform:translate(-5px,6px) rotate(40deg);opacity:1;}}
  .song[data-rk=S] .ico::after,.song[data-rk=SS] .ico::after{content:'';position:absolute;inset:0;border:3px solid #ffd84d;pointer-events:none;}
  .song[data-rk=SS] .ico::after{border-image:linear-gradient(135deg,#ff6b6b,#ffd84d,#7dff9b,#6bd5ff,#b58cff) 1;}
  .song-panel{max-height:0;overflow:hidden;transition:max-height .32s ease;}
  .song.sel .song-panel{max-height:120px;}
  .song-in{padding:0 14px 13px 78px;}
  .eqrow{display:flex;align-items:flex-end;gap:3px;height:20px;margin:0 0 10px;}
  .eqrow i{display:block;width:4px;height:100%;border-radius:2px;background:#3a2f3a;opacity:.55;transform-origin:bottom;transform:scaleY(.15);animation:eq .6s ease-in-out infinite alternate;animation-play-state:paused;}
  body.prevplay .song.sel .eqrow i{animation-play-state:running;}
  @keyframes eq{0%{transform:scaleY(.14);}100%{transform:scaleY(1);}}
  .btnrow{display:flex;align-items:center;gap:8px;}
  .dbtn{border:2px solid #d8cec6;background:transparent;color:#6a5a68;border-radius:100px;padding:8px 11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .dbtn.sel{border-color:var(--c);background:var(--c);color:#3a2f3a;}
  .go{margin-left:auto;border:none;border-radius:100px;padding:10px 20px;white-space:nowrap;font-size:15px;font-weight:800;font-family:inherit;color:#fff;background:#3a2f3a;box-shadow:0 5px 12px -6px rgba(0,0,0,.6);cursor:pointer;}
  .go:active{transform:scale(.95);}
  details.settings{margin-top:18px;}
  details.settings summary{cursor:pointer;opacity:.8;}
  /* pause */
  #pauseBtn{position:absolute;top:10px;right:12px;z-index:6;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer;display:none;}
  #pauseBtn:active{transform:scale(.92);}
  #pauseOv,#countOv{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(10,8,24,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  #pauseOv.on,#countOv.on{display:flex;}
  .pbox{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .ptitle{font-size:20px;font-weight:800;margin-bottom:16px;}
  #countOv{background:rgba(10,8,24,.45);font-size:96px;font-weight:900;color:#fff;text-shadow:0 0 30px var(--acc);}
  @keyframes cnt{from{transform:scale(1.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  #countOv span{animation:cnt .35s ease-out both;}
  /* game */
  #game{padding:0;justify-content:flex-start;}
  #hud{width:100%;max-width:480px;padding:34px 16px 6px;display:flex;justify-content:space-between;align-items:flex-end;}
  #hud .hp{font-size:12px;opacity:.7;}
  #hud .num{font-size:26px;font-weight:800;color:var(--gold);}
  #gauge{width:calc(100% - 32px);max-width:448px;height:8px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden;margin-bottom:6px;}
  #gaugeFill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#fff);transition:width .25s;}
  #cv{width:100%;max-width:480px;flex:1;min-height:0;display:block;}
  #pads{width:100%;max-width:480px;display:flex;flex-direction:column;gap:8px;padding:8px 12px 20px;}
  .stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .mains{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pad{border-radius:20px;border:2px solid rgba(255,255,255,.55);font-weight:800;color:#3a2438;background:#ddd;box-shadow:0 6px 16px -8px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.55);}
  .pad small{display:block;font-size:10px;opacity:.55;font-weight:600;margin-top:2px;}
  .pad.s{height:62px;font-size:26px;line-height:1;}
  .pad.m{height:100px;font-size:19px;}
  .pad.don{background:linear-gradient(180deg,#ffc6d8,#ff9fbd);color:#5b2338;}
  .pad.ka{background:linear-gradient(180deg,#bfe0ff,#8cc8ff);color:#1f3f5e;}
  .pad.clap{background:linear-gradient(180deg,#fff0b8,#ffdd78);}
  .pad.flower{background:linear-gradient(180deg,#c9f5dc,#97e2ba);}
  .pad.heart{background:linear-gradient(180deg,#e3d8ff,#bda6ff);}
  .pad:active,.pad.hit{transform:scale(.95);filter:brightness(1.12) saturate(1.1);}

  /* story */
  .avatar{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2cf,var(--gold) 70%);display:flex;align-items:center;justify-content:center;font-size:46px;margin-bottom:12px;box-shadow:0 0 30px -6px var(--gold);}
  .who{font-weight:700;font-size:16px;margin-bottom:2px;}
  .role{font-size:11px;opacity:.6;margin-bottom:14px;letter-spacing:.1em;}
  .textbox{width:min(420px,92%);min-height:130px;border:1px solid var(--line);border-radius:18px;padding:18px;background:rgba(255,255,255,.05);font-size:15px;line-height:1.9;text-align:left;white-space:pre-wrap;}
  .beat-tag{font-size:10px;letter-spacing:.2em;color:var(--gold);opacity:.85;margin-bottom:6px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
  .result-num{font-size:46px;font-weight:800;color:#fff;margin:6px 0 10px;text-shadow:0 0 18px var(--acc);}
  #result{overflow:hidden;}
  #confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .res-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;}
  .res-song{font-size:13px;opacity:.8;letter-spacing:.06em;margin-bottom:6px;}
  @keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0;}60%{transform:scale(1.25) rotate(3deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
  @keyframes rise{from{transform:translateY(12px);opacity:0;}to{transform:none;opacity:1;}}
  .rank{font-size:112px;line-height:1;font-weight:900;color:#fff;text-shadow:0 0 28px var(--rc,var(--acc)),0 0 60px var(--rc,var(--acc));-webkit-text-stroke:3px var(--rc,var(--acc));animation:pop .7s cubic-bezier(.2,.9,.3,1.2) .15s both;}
  .rank.ss{font-size:96px;letter-spacing:-4px;color:transparent;-webkit-text-stroke:0;text-shadow:none;background:linear-gradient(90deg,#ffe066,#ff9ad5,#9ad8ff,#a6ffb5,#ffe066,#ff9ad5);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 14px #ffd84d) drop-shadow(0 0 30px #ff9ad5);animation:pop .7s cubic-bezier(.2,.9,.3,1.2) .15s both,rainbowmove 3s linear infinite .85s;}
  @keyframes rainbowmove{to{background-position:300% 0;}}
  .res-msg{font-size:16px;font-weight:700;margin:4px 0 6px;animation:rise .5s ease .6s both;}
  .result-num small{font-size:16px;font-weight:700;opacity:.8;}
  .newtag{display:inline-block;vertical-align:middle;margin-left:10px;font-size:13px;font-weight:800;color:#5b4300;background:linear-gradient(90deg,#ffe88a,#ffc94d);padding:4px 10px;border-radius:100px;transform:rotate(-6deg);}
  .chips{display:flex;gap:10px;margin:2px 0 12px;animation:rise .5s ease 1s both;}
  .chip{min-width:84px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid var(--cc);display:flex;flex-direction:column;align-items:center;}
  .chip b{font-size:22px;font-weight:800;color:var(--cc);}
  .chip span{font-size:11px;opacity:.85;}
  .c-perfect{--cc:#ffd84d;} .c-good{--cc:#ffe27a;} .c-ok{--cc:#a5dcff;}
  .sub2{font-size:12px;opacity:.75;line-height:1.8;margin-bottom:10px;animation:rise .5s ease 1.2s both;}
  #result .row{animation:rise .5s ease 1.4s both;}
</style>
</head>
<body>

<!-- START（曲選択） -->
<div class="screen on" id="start">
  <h1>音ゲープロトタイプ</h1>
  <button id="bnMute" aria-label="曲の試聴のオン・オフ">🔊</button>
  <details class="howto">
    <summary>あそびかた</summary>
    <div>🩷🩵 <b>ドン・カッ</b>：落ちてきたノーツに合わせてタップ。つなげるとコンボ。</div>
    <div>👏🌸💖 <b>スタンプ</b>：まんなかのレーンに来たら、<b>どれを押してもOK</b>。<b>同じマークを押せば得点アップ</b>！</div>
    <div class="ht2">スタンプは押さなくてもコンボは切れません。余裕があるときだけどうぞ。</div>
  </details>
  <div id="songList"></div>
  <details class="settings">
    <summary>設定</summary>
    <label style="margin-top:10px">タイミング調整 <span id="offVal">0ms</span><input type="range" id="offset" min="-250" max="250" step="10" value="0"></label>
    <div style="opacity:.6;line-height:1.7">ノーツが曲より遅く感じたら＋、早く感じたら−に動かしてください。</div>
  </details>
</div>

<!-- GAME -->
<div class="screen" id="game">
  <button id="pauseBtn" aria-label="一時停止">⏸</button>
  <div id="pauseOv"><div class="pbox">
    <div class="ptitle">一時停止中</div>
    <button class="big-btn" id="pResume">続ける</button>
    <button class="ghost-btn" id="pRetry">最初からやり直す</button>
    <button class="ghost-btn" id="pQuit">やめる → 曲選択へ</button>
  </div></div>
  <div id="countOv"></div>
  <div id="hud"><div><div class="hp">スコア</div><div class="num" id="score">0</div></div><div style="text-align:center"><div class="hp">コンボ</div><div class="num" id="combo">0</div></div><div class="hp" id="time" style="min-width:64px;text-align:right"></div></div>
  <div id="gauge"><div id="gaugeFill"></div></div>
  <canvas id="cv"></canvas>
  <div id="pads">
    <div class="mains">
      <button class="pad m don" id="padDon">ドン<small>F</small></button>
      <button class="pad m ka" id="padKa">カッ<small>J</small></button>
    </div>
    <div class="stamps">
      <button class="pad s clap" id="padClap">👏</button>
      <button class="pad s flower" id="padFlower">🌸</button>
      <button class="pad s heart" id="padHeart">💖</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="result">
  <canvas id="confetti"></canvas>
  <div class="res-inner">
    <div class="res-song" id="resSong"></div>
    <div class="rank" id="resRank">S</div>
    <div class="res-msg" id="resMsg"></div>
    <div class="result-num"><small>達成率</small> <span id="resScore">0</span><small>%</small><span class="newtag" id="resNew">NEW!</span></div>
    <div class="chips">
      <div class="chip c-perfect"><b id="cPerfect">0</b><span>バッチリ！</span></div>
      <div class="chip c-good"><b id="cGood">0</b><span>いいね！</span></div>
      <div class="chip c-ok"><b id="cOk">0</b><span>OK</span></div>
    </div>
    <div class="sub2" id="resInfo"></div>
    <div class="row">
      <button class="big-btn" id="btnAgain">もう一度</button>
    </div>
    <button class="ghost-btn" id="btnBack">曲選択へ</button>
  </div>
</div>

<audio id="bgm" preload="auto"></audio>
<audio id="prev" preload="none"></audio>

<script>
/* ===== 設定 ===== */
/* 難易度：ふつう／かんたん（setDiff で切り替え） */
const DIFFS = {
  normal:{label:'ふつう',  travel:1.5, window:0.28, pEarly:0.30, pLate:0.45},
  easy:  {label:'やさしい',travel:2.1, window:0.40, pEarly:0.12, pLate:0.20}
};
let DIFF='normal';
let TRAVEL = 1.5;            // 本番ノーツが落ちるのにかかる秒数
let WINDOW = 0.28;           // 本番ノーツの判定幅（秒）。ゆるめ
const STAMP_WINDOW = 0.32;   // スタンプの判定幅（秒）。さらにゆるめ
let FIRST_BEAT = 0.2;        // 曲の最初の拍の位置（秒）。曲ごとに startGame で設定
const MAIN = ['don','ka'];
const STAMPS = ['clap','flower','heart'];
const STAMP_ICON = {clap:'👏', flower:'🌸', heart:'💖'};
// ランクの境目（達成率）：SS 90% ／ S 75% ／ A 55% ／ B 35% ／ C それ未満
function rankOf(r){ return r>=0.9?'SS':r>=0.75?'S':r>=0.55?'A':r>=0.35?'B':'C'; }
const rankOfRec = b=>rankOf(b.pct/100);   // 保存した達成率から毎回ランクを出す（境目を変えても記録に反映される）
const RANK_STYLE={SS:{c:'#ffe066',m:'伝説級！　最高のステージだった！'},S:{c:'#ffd84d',m:'さいこうの盛り上がり！'},A:{c:'#ffb7c9',m:'すごい！いいノリだったね'},B:{c:'#a5dcff',m:'いい感じ！'},C:{c:'#c9b2ff',m:'おつかれさま！また遊んでね'}};
const TIER = {perfect:{text:'バッチリ！',color:'#ffd84d'}, good:{text:'いいね！',color:'#ffe27a'}, ok:{text:'OK',color:'#a5dcff'}};   // 判定の見た目：金／金（小さめ）／水色
const COLOR = {don:'#ff9fbd', ka:'#8cc8ff', clap:'#ffdd78', flower:'#97e2ba', heart:'#bda6ff'};
function hexA(h,a){ const n=parseInt(h.slice(1),16); return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
const isStamp = l => l==='stamp';   // 判定上のレーン名。3種のボタンはどれでも同じ扱い
const PERFECT_PT = 1.5;   // バッチリの点（いいね・OKは1点）
const STAMP_ANY = 2, STAMP_MATCH = 6;   // スタンプの点：どれでもOK / 絵柄ぴったり

/* ===== 曲リスト =====
   bpm  : 曲のBPM
   first: 最初の拍の位置（秒）。分からなければ 0
   tentative: true の間は「BPM仮」と表示。曲を解析できたら false にして数字を入れる */

/* ===== 効果音（WebAudioで仮の音を合成） ===== */
let actx=null;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); }
function tone(freq,dur,type,vol,slideTo){
  if(!actx) return; const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
}
function noise(dur,vol){
  if(!actx) return; const t=actx.currentTime;
  const len=Math.floor(actx.sampleRate*dur), buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=actx.createBufferSource(); s.buffer=buf;
  const f=actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=2200;
  const g=actx.createGain(); g.gain.value=vol;
  s.connect(f).connect(g).connect(actx.destination); s.start(t);
}

/* バスドラ（トッ）：短く締まった低音。ピッチが一瞬で下がる */
function kick(){
  if(!actx) return; const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(170,t);
  o.frequency.exponentialRampToValueAtTime(48,t+0.09);
  g.gain.setValueAtTime(0.75,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.22);
  // 頭のアタック（クリック感）
  const len=Math.floor(actx.sampleRate*0.012), buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=actx.createBufferSource(); s.buffer=buf;
  const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1800;
  const cg=actx.createGain(); cg.gain.value=0.25;
  s.connect(f).connect(cg).connect(actx.destination); s.start(t);
}
/* スネア：ノイズ（ジャッ）＋胴鳴り（トン） */
function snare(){
  if(!actx) return; const t=actx.currentTime;
  const dur=0.18, len=Math.floor(actx.sampleRate*dur), buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=actx.createBufferSource(); s.buffer=buf;
  const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2000; bp.Q.value=0.7;
  const ng=actx.createGain(); ng.gain.setValueAtTime(0.7,t); ng.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(bp).connect(ng).connect(actx.destination); s.start(t);
  const o=actx.createOscillator(), og=actx.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(150,t+0.08);
  og.gain.setValueAtTime(0.45,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.11);
  o.connect(og).connect(actx.destination); o.start(t); o.stop(t+0.12);
}
function playSE(lane){
  if(lane==='don'){ kick(); }
  else if(lane==='ka'){ snare(); }
  else {
    const f = lane==='clap'?784 : lane==='flower'?988 : 1175;
    tone(f,0.14,'triangle',0.3); setTimeout(()=>tone(f*1.5,0.2,'triangle',0.25),70);
  }
}

/* ===== 譜面生成（BPMだけで自動） ===== */
const PATTERNS_EASY = [
  [['don',0],['ka',2]],
  [['don',0],['don',2]],
  [['don',0],['ka',2],['don',3]],
  [['don',0],['don',1],['ka',2]],
  [['don',0],['ka',1],['don',2],['ka',3]]
];
const PATTERNS_NORMAL = [
  [['don',0],['don',1],['don',2],['don',3]],
  [['don',0],['ka',1],['don',2],['ka',3]],
  [['don',0],['don',1.5],['ka',2],['don',3]],
  [['don',0],['ka',1],['don',2],['don',2.5],['ka',3]],
  [['don',0],['ka',2]],
  [['ka',0.5],['don',1],['ka',2.5],['don',3]]
];
function buildChart(bpm,duration){
  const PATTERNS = DIFF==='easy'?PATTERNS_EASY:PATTERNS_NORMAL, D=DIFFS[DIFF];
  const beat=60/bpm, notes=[]; let m=0;
  // 最初のノーツが画面の一番上から出てくるまで、さらに1拍の間を置く
  const lead=Math.ceil(TRAVEL/beat)+1;
  for(let b=lead;;b+=4,m++){
    if(FIRST_BEAT+b*beat > duration-3) break;
    const p = m<2 ? PATTERNS[m%2] : PATTERNS[Math.floor(Math.random()*PATTERNS.length)];
    p.forEach(([lane,off])=>notes.push({t:FIRST_BEAT+(b+off)*beat,lane,hit:false,done:false}));
    // スタンプ：真ん中のレーン。裏拍に置き、本番ノーツと同時にはしない
    if(m>=1){
      const prob = m<4 ? D.pEarly : D.pLate;
      [0.5,1.5,2.5,3.5].forEach(off=>{
        if(p.some(([,o])=>o===off)) return;
        if(Math.random()<prob){ const kind=STAMPS[Math.floor(Math.random()*3)]; notes.push({t:FIRST_BEAT+(b+off)*beat,lane:'stamp',kind,icon:STAMP_ICON[kind],hit:false,done:false}); }
      });
    }
  }
  return notes.sort((x,y)=>x.t-y.t);
}

/* ===== ゲーム本体 ===== */
const bgm=$('bgm'), cv=$('cv'), ctx=cv.getContext('2d');
let notes=[], score=0, maxScore=1, combo=0, maxCombo=0, stampHit=0, stampMatch=0, stampTotal=0;
let running=false, offsetSec=0, effects=[], raf=0, comboPop=null;
let cnt={perfect:0,good:0,ok:0,miss:0};
let gState='idle';   // idle / play / paused / counting

$('offset').addEventListener('input',e=>{ $('offVal').textContent=e.target.value+'ms'; lsSet(TKEY,e.target.value); });

function resize(){
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=Math.floor(r.width*dpr); cv.height=Math.floor(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',()=>{ if($('game').classList.contains('on')) resize(); });

function startGame(){
  stopPreview();
  ensureAudio();
  const bpm=curSong.bpm; FIRST_BEAT=curSong.first||0;
  TRAVEL=DIFFS[DIFF].travel; WINDOW=DIFFS[DIFF].window;
  if(!bgm.src.endsWith(curSong.file.replace('..',''))){ bgm.src=curSong.file; }
  offsetSec=(parseInt($('offset').value,10)||0)/1000;
  show('game'); resize();
  const go=()=>{
    notes=buildChart(bpm,(isFinite(bgm.duration)&&bgm.duration>10)?bgm.duration:120);
    maxScore=notes.reduce((s,n)=>s+(isStamp(n.lane)?STAMP_MATCH:PERFECT_PT),0)||1;
    stampTotal=notes.filter(n=>isStamp(n.lane)).length; stampHit=0; stampMatch=0;
    score=0; combo=0; maxCombo=0; effects=[]; comboPop=null; cnt={perfect:0,good:0,ok:0,miss:0}; updateHud();
    bgm.currentTime=0;
    $('pauseOv').classList.remove('on'); $('countOv').classList.remove('on');
    bgm.play().then(()=>{ running=true; gState='play'; $('pauseBtn').style.display='block'; loop(); }).catch(()=>{
      alert('曲を読み込めませんでした。'+curSong.file+' のパスを確認してください。'); show('start');
    });
  };
  if(bgm.readyState>=1) go(); else bgm.addEventListener('loadedmetadata',go,{once:true});
  bgm.load && bgm.readyState===0 && bgm.load();
}

function nowT(){ return bgm.currentTime + offsetSec; }

// pad: 押したボタンの種類（don / ka / clap / flower / heart）
const PAD_ID = {don:'padDon',ka:'padKa',clap:'padClap',flower:'padFlower',heart:'padHeart'};
function press(pad){
  if(!running) return;
  playSE(pad);
  const lane = STAMPS.includes(pad) ? 'stamp' : pad;   // スタンプ3種はどれでも同じ判定
  const t=nowT();
  let best=null, bd=WINDOW;
  for(const n of notes){
    if(n.hit||n.done||n.lane!==lane) continue;
    const d=Math.abs(n.t-t);
    if(d<bd){ bd=d; best=n; }
  }
  if(best){
    best.hit=true;
    const st=isStamp(lane);
    const mult = 1 + Math.min(combo,40)/40;   // コンボで最大2倍
    const match = st && best.kind===pad;       // スタンプの絵柄が合っているか
    const tier = st?null:(bd<0.06?'perfect':bd<0.14?'good':'ok');
    score += (st ? (match?STAMP_MATCH:STAMP_ANY) : (tier==='perfect'?PERFECT_PT:1))*mult;
    if(st){ stampHit++; if(match) stampMatch++; } else cnt[tier]++;
    combo++; if(combo>maxCombo) maxCombo=combo;
    if(combo===10||combo===25||combo%50===0) comboPop={n:combo,born:performance.now()};
    updateHud();
    effects.push({lane,match,seed:Math.random()*6.28,color:COLOR[st?pad:lane],born:performance.now(),tier,text: st?(match?STAMP_ICON[pad]+' ぴったり！':STAMP_ICON[pad]):TIER[tier].text});
    try{ navigator.vibrate && navigator.vibrate(8); }catch(e){}
  }
  // 外れたタップは何も起きない（ペナルティなし）
  const el=$(PAD_ID[pad]);
  el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),80);
}
function updateHud(){
  $('score').textContent=Math.round(score);
  $('combo').textContent=combo;
  $('gaugeFill').style.width=Math.min(100,(score/(maxScore*1.9))*100)+'%';
}

// 3レーン：ドン｜スタンプ｜カッ。判定ラインは全部同じ高さ（視線を動かさなくていい）
const LANES=['don','stamp','ka'];
const LANE_X={don:0.22, stamp:0.5, ka:0.78};

function loop(){
  if(!running) return;
  const rc=cv.getBoundingClientRect(), w=rc.width, h=rc.height;
  ctx.clearRect(0,0,w,h);
  const t=nowT();
  const hitY=h-52, spawnY=-28;

  const acc=curSong.acc, nowMs=performance.now();
  // 背景：拍に合わせてやさしく明滅。コンボ演出の時は少し強く
  const beat=60/curSong.bpm, ph=(((t-FIRST_BEAT)/beat)%1+1)%1;
  let glow=0.07+0.10*Math.exp(-ph*4);
  if(comboPop){ const ca=1-(nowMs-comboPop.born)/900; if(ca>0) glow+=0.22*ca; }
  const gr=ctx.createRadialGradient(w/2,h*0.62,10,w/2,h*0.62,w*0.95);
  gr.addColorStop(0,hexA(acc,glow)); gr.addColorStop(1,hexA(acc,0));
  ctx.fillStyle=gr; ctx.fillRect(0,0,w,h);

  // レーン
  LANES.forEach(ln=>{
    const x=w*LANE_X[ln], lw=ln==='stamp'?w*0.2:w*0.3;
    ctx.fillStyle=hexA(ln==='stamp'?COLOR.clap:COLOR[ln],.07);
    ctx.fillRect(x-lw/2,0,lw,h);
  });
  // 判定リング
  LANES.forEach(ln=>{
    const x=w*LANE_X[ln], r=ln==='stamp'?26:30, col=ln==='stamp'?COLOR.clap:COLOR[ln];
    ctx.beginPath(); ctx.arc(x,hitY,r,0,Math.PI*2);
    ctx.shadowColor=col; ctx.shadowBlur=12;
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke(); ctx.shadowBlur=0;
  });

  // ノーツ
  for(const n of notes){
    const dt=n.t-t;
    // 取り逃し：本番ノーツだけコンボが切れる。スタンプは素通りOK
    if(!n.hit && !n.done && dt<-WINDOW){
      n.done=true;
      if(!isStamp(n.lane)){ cnt.miss++; if(combo>0){ combo=0; updateHud(); } }
    }
    if(n.hit || dt>TRAVEL || dt<-0.4) continue;
    const st=isStamp(n.lane);
    const y=hitY-(dt/TRAVEL)*(hitY-spawnY);
    const x=w*LANE_X[n.lane];
    ctx.globalAlpha = dt<0 ? Math.max(0,1+dt/0.4)*0.6 : 1;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(st){
      // スタンプ：白い丸の下地＋絵柄と同じ色のふち（押すボタンの色と同じ）
      const col=COLOR[n.kind];
      ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2);
      ctx.shadowColor=col; ctx.shadowBlur=12;
      ctx.fillStyle='rgba(255,255,255,.93)'; ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle=col; ctx.lineWidth=3.5; ctx.stroke();
      ctx.font='22px sans-serif'; ctx.fillStyle='#fff'; ctx.fillText(n.icon,x,y+1);
    } else {
      const col=COLOR[n.lane];
      ctx.beginPath(); ctx.arc(x,y,28,0,Math.PI*2);
      ctx.shadowColor=col; ctx.shadowBlur=14;
      ctx.fillStyle=col; ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=3; ctx.stroke();
      ctx.font='bold 13px sans-serif'; ctx.fillStyle=n.lane==='don'?'#5b2338':'#1f3f5e'; ctx.fillText(n.lane==='don'?'ドン':'カッ',x,y);
    }
    ctx.globalAlpha=1;
  }

  // ヒット演出：リング＋光の粒（判定ラインのすぐ上）
  effects=effects.filter(e=>nowMs-e.born<700);
  for(const e of effects){
    const a=1-(nowMs-e.born)/700, st=isStamp(e.lane), x=w*LANE_X[e.lane], col=e.color;
    ctx.globalAlpha=a;
    ctx.beginPath(); ctx.arc(x,hitY,(st?26:30)+(1-a)*26,0,Math.PI*2);
    ctx.strokeStyle=(e.tier&&e.tier!=='ok')?TIER[e.tier].color:col; ctx.lineWidth=(e.match||e.tier==='perfect')?6:3; ctx.stroke();
    const big=e.match||e.tier==='perfect', cnt=big?14:9;
    for(let i=0;i<cnt;i++){
      const ang=e.seed+i/cnt*Math.PI*2, d=18+(1-a)*(big?64:46)+(i%2)*10;
      ctx.beginPath(); ctx.arc(x+Math.cos(ang)*d,hitY+Math.sin(ang)*d,(big?4.5:3.5)*a+0.5,0,Math.PI*2);
      ctx.fillStyle=i%3===0?'#fff':col; ctx.fill();
    }
    const tc=e.tier?TIER[e.tier].color:null;
    ctx.fillStyle=tc||(e.match?'#fff2b0':'#fff'); ctx.textBaseline='middle';
    ctx.font = st?(e.match?'bold 20px sans-serif':'26px sans-serif'):(e.tier==='perfect'?'800 20px sans-serif':'bold 15px sans-serif');
    if(tc){ ctx.shadowColor=tc; ctx.shadowBlur=e.tier==='perfect'?14:8; }
    ctx.fillText(e.text,x,hitY-48-(1-a)*24);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  // コンボ演出：画面中央に「10 COMBO!」
  if(comboPop){
    const age=nowMs-comboPop.born;
    if(age>=900) comboPop=null; else {
      const sc=age<160?0.6+0.4*(age/160)*1.15:1+0.05*Math.sin(age/90), al=age<650?1:1-(age-650)/250;
      ctx.save(); ctx.globalAlpha=Math.max(0,al); ctx.translate(w/2,h*0.34); ctx.scale(sc,sc);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='800 40px -apple-system,"Hiragino Sans",sans-serif'; ctx.lineJoin='round';
      ctx.shadowColor=acc; ctx.shadowBlur=22; ctx.lineWidth=8; ctx.strokeStyle=hexA(acc,.85);
      ctx.strokeText(comboPop.n+' COMBO!',0,0); ctx.shadowBlur=0;
      ctx.fillStyle='#fff'; ctx.fillText(comboPop.n+' COMBO!',0,0);
      ctx.restore();
    }
  }
  // 残り時間
  if(isFinite(bgm.duration)){ const rest=Math.max(0,Math.ceil(bgm.duration-bgm.currentTime)); $('time').textContent='残り '+rest+'秒'; }
  raf=requestAnimationFrame(loop);
}

bgm.addEventListener('ended',()=>{ if(running) finish(); });

let confRaf=0, countRaf=0;
function startConfetti(n){
  const c=$('confetti'), g=c.getContext('2d'), dpr=window.devicePixelRatio||1, W=innerWidth, H=innerHeight;
  c.width=W*dpr; c.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  const cols=[curSong.acc,'#ffd84d','#ffb7c9','#a5dcff','#97e2ba','#bda6ff'];
  const ps=Array.from({length:n},()=>({x:Math.random()*W,y:-20-Math.random()*H*0.8,vy:60+Math.random()*90,vx:(Math.random()-.5)*40,w:6+Math.random()*7,h:9+Math.random()*8,a:Math.random()*6.28,va:(Math.random()-.5)*6,col:cols[Math.floor(Math.random()*cols.length)],ph:Math.random()*6.28}));
  let last=performance.now(); const t0=last;
  cancelAnimationFrame(confRaf);
  (function f(now){
    if(!$('result').classList.contains('on')) return;
    const dt=Math.min(0.05,(now-last)/1000); last=now; g.clearRect(0,0,W,H);
    const fade=Math.max(0,Math.min(1,(7000-(now-t0))/2000));
    ps.forEach(p=>{ p.y+=p.vy*dt; p.x+=(p.vx+Math.sin(now/600+p.ph)*24)*dt; p.a+=p.va*dt; if(p.y>H+20&&now-t0<4500){p.y=-20;}
      g.save(); g.globalAlpha=.9*fade; g.translate(p.x,p.y); g.rotate(p.a); g.scale(1,Math.cos(p.a*1.3)); g.fillStyle=p.col; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); });
    if(fade>0) confRaf=requestAnimationFrame(f); else g.clearRect(0,0,W,H);
  })(last);
}
function finish(){
  running=false; cancelAnimationFrame(raf);
  gState='idle'; $('pauseBtn').style.display='none';
  const ratio=score/(maxScore*1.9), fin=Math.min(100,Math.round(ratio*100)), rk=rankOf(fin/100), st=RANK_STYLE[rk];
  const prev=getBest(bestId(curSong.id));
  const isNew = !prev || fin>prev.pct;
  if(isNew) setBest(bestId(curSong.id), {pct:fin, rank:rk});
  $('resSong').textContent=curSong.title+'　［'+DIFFS[DIFF].label+'］';
  const rEl=$('resRank'); rEl.className='rank'+(rk==='SS'?' ss':''); rEl.textContent=rk; rEl.style.setProperty('--rc',st.c);
  rEl.style.animation='none'; void rEl.offsetWidth; rEl.style.animation='';
  $('resMsg').textContent=st.m;
  $('resNew').style.display=(isNew&&fin>0)?'inline-block':'none';
  $('cPerfect').textContent=cnt.perfect; $('cGood').textContent=cnt.good; $('cOk').textContent=cnt.ok;
  $('resInfo').innerHTML='最大コンボ '+maxCombo+'　／　'+(cnt.miss?'ミス '+cnt.miss:'ミスなし！')+'<br>スタンプ '+stampHit+'/'+stampTotal+'（ぴったり '+stampMatch+'）';
  // 点数のカウントアップ
  const t0=performance.now(); cancelAnimationFrame(countRaf);
  (function cu(now){ const k=Math.min(1,(now-t0)/1300); $('resScore').textContent=Math.round(fin*(1-Math.pow(1-k,3))); if(k<1) countRaf=requestAnimationFrame(cu); })(t0);
  show('result');
  startConfetti(rk==='SS'?130:rk==='S'?90:rk==='A'?70:rk==='B'?50:28);
}

/* ===== 一時停止（電話や通知にも対応） ===== */
let cdTimer=0;
function pauseGame(){
  if(gState!=='play') return;
  gState='paused'; running=false; cancelAnimationFrame(raf); bgm.pause();
  $('pauseOv').classList.add('on');
}
function resumeGame(){
  if(gState!=='paused') return;
  gState='counting'; $('pauseOv').classList.remove('on');
  const ov=$('countOv'); ov.classList.add('on'); let n=3;
  const tick=()=>{
    if(n>0){ ov.innerHTML='<span>'+n+'</span>'; n--; cdTimer=setTimeout(tick,750); }
    else { ov.classList.remove('on'); bgm.play().then(()=>{ gState='play'; running=true; loop(); }).catch(()=>{ gState='paused'; $('pauseOv').classList.add('on'); }); }
  };
  tick();
}
function quitGame(){
  clearTimeout(cdTimer); gState='idle'; running=false; cancelAnimationFrame(raf); bgm.pause();
  $('pauseOv').classList.remove('on'); $('countOv').classList.remove('on'); $('pauseBtn').style.display='none';
  renderSongs(); show('start'); playPreview(curSong);
}
$('pauseBtn').addEventListener('click',pauseGame);
$('pResume').addEventListener('click',resumeGame);
$('pQuit').addEventListener('click',quitGame);
$('pRetry').addEventListener('click',()=>{ clearTimeout(cdTimer); gState='idle'; running=false; cancelAnimationFrame(raf); bgm.pause(); startGame(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ pauseGame(); stopPreview(); } });   // 別アプリに行ったら自動で一時停止

/* ===== イベント ===== */
$('btnAgain').addEventListener('click',startGame);
$('btnBack').addEventListener('click',()=>{ renderSongs(); show('start'); playPreview(curSong); });
Object.entries(PAD_ID).forEach(([pad,id])=>{
  $(id).addEventListener('pointerdown',e=>{ e.preventDefault(); press(pad); });
});
window.addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){ gState==='play'?pauseGame():gState==='paused'&&resumeGame(); return; }
  if(e.key==='f'||e.key==='F') press('don');
  else if(e.key==='j'||e.key==='J') press('ka');
  else if(e.key==='1') press('clap');
  else if(e.key==='2') press('flower');
  else if(e.key==='3') press('heart');
});
</script>
