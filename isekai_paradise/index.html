<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>異世界パラダイス幸福度クロニクル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f3ecd8;
    --paper:#fbf6ea;
    --slum-a:#221f2b;
    --slum-b:#2f2a35;
    --paradise-a:#3a2350;
    --paradise-b:#e8b04b;
    --gold:#e8b04b;
    --glow:#ffe3a3;
    --rose:#e8879a;
    --line: rgba(243,236,216,0.16);
    --tier0-1:#1c1a24;
    --tier0-2:#2a2531;
    --tier1-1:#211f34;
    --tier1-2:#3a2f4d;
    --tier2-1:#2a2140;
    --tier2-2:#5a3a5e;
    --tier3-1:#3a2246;
    --tier3-2:#8a4e5a;
    --tier4-1:#4a2340;
    --tier4-2:#e8b04b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    background: radial-gradient(circle at 20% 0%, var(--tier0-2), var(--tier0-1) 60%);
    transition: background 1.4s ease;
    overflow-x:hidden;
    position:relative;
  }
  body[data-tier="1"]{background: radial-gradient(circle at 20% 0%, var(--tier1-2), var(--tier1-1) 60%);}
  body[data-tier="2"]{background: radial-gradient(circle at 20% 0%, var(--tier2-2), var(--tier2-1) 60%);}
  body[data-tier="3"]{background: radial-gradient(circle at 20% 0%, var(--tier3-2), var(--tier3-1) 60%);}
  body[data-tier="4"]{background: radial-gradient(circle at 30% 0%, var(--tier4-2), var(--tier4-1) 55%);}

  .stars{
    position:fixed; inset:0; pointer-events:none; opacity:0.5;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, var(--ink), transparent),
      radial-gradient(1.5px 1.5px at 80% 10%, var(--ink), transparent),
      radial-gradient(1px 1px at 40% 60%, var(--ink), transparent),
      radial-gradient(1.5px 1.5px at 70% 80%, var(--ink), transparent),
      radial-gradient(1px 1px at 90% 50%, var(--ink), transparent),
      radial-gradient(1px 1px at 25% 85%, var(--ink), transparent);
    background-repeat:no-repeat;
  }

  .wrap{
    max-width:720px; margin:0 auto; padding:32px 20px 80px;
    position:relative; z-index:1;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--gold); opacity:0.85; text-align:center; margin-bottom:6px;
  }
  h1.title{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(26px,6vw,38px);
    text-align:center; margin:0 0 6px;
    letter-spacing:0.02em;
    background: linear-gradient(90deg, var(--glow), var(--gold) 60%, var(--rose));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lede{
    text-align:center; font-size:13.5px; color:var(--ink); opacity:0.65;
    margin:0 0 34px; line-height:1.7;
  }

  /* --- select screen --- */
  .total-happiness{
    text-align:center; font-family:'JetBrains Mono',monospace; font-size:13px;
    color:var(--gold); opacity:0.85; letter-spacing:0.05em; margin-bottom:18px;
  }
  .char-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:520px){ .char-grid{grid-template-columns:1fr;} }
  .char-card{
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    border:1px solid var(--line); border-radius:18px;
    padding:22px 18px; text-align:center; cursor:pointer;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .char-card:hover{ transform:translateY(-4px); border-color:var(--card-color,var(--gold)); box-shadow:0 10px 30px -12px var(--card-color,var(--gold)); }
  .emblem{
    width:78px; height:78px; margin:0 auto 14px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--glow-c,var(--glow)), var(--card-color,var(--gold)) 70%);
    box-shadow:0 0 30px -6px var(--card-color,var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:26px; color:#241522;
  }
  .char-card h3{ font-family:'Shippori Mincho',serif; font-size:19px; margin:0 0 4px; }
  .char-card p{ font-size:12px; opacity:0.6; margin:0 0 14px; line-height:1.6;}
  .char-progress{ font-family:'JetBrains Mono',monospace; font-size:11px; opacity:0.75; }

  .char-card.locked{
    opacity:0.55; cursor:default; filter:grayscale(0.6);
  }
  .char-card.locked:hover{ transform:none; border-color:var(--line); box-shadow:none; }
  .locked-emblem{
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.15), rgba(255,255,255,0.03) 70%);
    box-shadow:none; color:var(--ink); opacity:0.7;
  }

  .reset-save-btn{
    display:block; margin:28px auto 0; background:none; border:none;
    color:var(--ink); opacity:0.4; font-size:11px; font-family:'Zen Kaku Gothic New',sans-serif;
    text-decoration:underline; cursor:pointer;
  }
  .reset-save-btn:hover{ opacity:0.7; }

  /* --- game screen --- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; gap:12px;
  }
  .backbtn{
    background:none; border:1px solid var(--line); color:var(--ink);
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:12px;
    padding:8px 14px; border-radius:100px; cursor:pointer; opacity:0.75;
    transition:opacity .2s, border-color .2s;
  }
  .backbtn:hover{ opacity:1; border-color:var(--gold); }

  .who{ display:flex; align-items:center; gap:10px; }
  .who .dot{ width:34px; height:34px; border-radius:50%; background:var(--card-color,var(--gold)); box-shadow:0 0 16px -2px var(--card-color,var(--gold)); flex:none; }
  .who .name{ font-family:'Shippori Mincho',serif; font-weight:700; font-size:15px; }
  .who .rank{ font-size:10.5px; opacity:0.6; font-family:'JetBrains Mono',monospace; letter-spacing:0.05em; }

  .gauge-shell{
    border:1px solid var(--line); border-radius:100px; height:12px;
    overflow:hidden; background:rgba(0,0,0,0.25); margin-bottom:4px;
  }
  .gauge-fill{
    height:100%; border-radius:100px;
    background:linear-gradient(90deg, var(--rose), var(--gold), var(--glow));
    width:0%; transition: width 1s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 0 12px 1px var(--gold);
  }
  .gauge-num{
    text-align:right; font-family:'JetBrains Mono',monospace; font-size:11px; opacity:0.7;
    margin-bottom:22px;
  }

  .scene{
    position:relative;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.01));
    border-radius:20px; padding:26px 24px 22px;
    margin-bottom:18px;
  }
  .scene::before{
    content:""; position:absolute; top:14px; left:14px; width:16px; height:16px;
    border-top:2px solid var(--card-color,var(--gold)); border-left:2px solid var(--card-color,var(--gold));
    opacity:0.7;
  }
  .scene::after{
    content:""; position:absolute; bottom:14px; right:14px; width:16px; height:16px;
    border-bottom:2px solid var(--card-color,var(--gold)); border-right:2px solid var(--card-color,var(--gold));
    opacity:0.7;
  }
  .scene-label{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.15em;
    text-transform:uppercase; color:var(--card-color,var(--gold)); margin-bottom:10px; opacity:0.85;
  }
  .scene-text{
    font-size:15.5px; line-height:1.95; white-space:pre-wrap;
  }

  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice-btn{
    text-align:left; padding:15px 18px; border-radius:14px;
    border:1px solid var(--line); background:rgba(255,255,255,0.03);
    color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; font-size:14px;
    cursor:pointer; transition: border-color .2s, background .2s, transform .15s;
    line-height:1.5;
  }
  .choice-btn:hover{ border-color:var(--card-color,var(--gold)); background:rgba(255,255,255,0.07); transform:translateX(2px); }
  .choice-btn .delta-hint{
    display:block; margin-top:5px; font-family:'JetBrains Mono',monospace; font-size:10.5px; opacity:0.55;
  }
  .continue-btn{
    margin-top:4px; align-self:flex-end;
    background:linear-gradient(90deg, var(--gold), var(--rose));
    color:#241522; border:none; padding:12px 22px; border-radius:100px;
    font-weight:700; font-size:13px; cursor:pointer;
    box-shadow:0 8px 20px -8px var(--gold);
  }

  /* --- popup burst --- */
  .burst-layer{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:50;
  }
  .burst{
    font-family:'JetBrains Mono',monospace; font-weight:700;
    font-size:54px; color:var(--glow);
    text-shadow:0 0 20px var(--gold), 0 0 50px var(--rose);
    opacity:0; transform:scale(0.4);
  }
  .burst.play{ animation: burstpop 1.5s cubic-bezier(.2,1.4,.3,1) forwards; }
  @keyframes burstpop{
    0%{ opacity:0; transform:scale(0.3) translateY(20px);}
    18%{ opacity:1; transform:scale(1.15) translateY(0);}
    30%{ transform:scale(1);}
    75%{ opacity:1; }
    100%{ opacity:0; transform:scale(1) translateY(-30px);}
  }
  .rankup-banner{
    position:fixed; left:0; right:0; top:26%; text-align:center; z-index:51;
    pointer-events:none; opacity:0;
  }
  .rankup-banner.play{ animation: bannerslide 2.2s ease forwards; }
  @keyframes bannerslide{
    0%{ opacity:0; transform:translateY(-14px) scale(0.96);}
    14%{ opacity:1; transform:translateY(0) scale(1);}
    80%{ opacity:1;}
    100%{ opacity:0; transform:translateY(-6px) scale(1);}
  }
  .rankup-banner .lbl{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:0.2em; color:var(--glow); background:rgba(20,10,20,0.55);
    border:1px solid var(--gold); padding:5px 14px; border-radius:100px; margin-bottom:10px;
  }
  .rankup-banner .big{
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:clamp(28px,7vw,44px);
    background:linear-gradient(90deg, var(--glow), var(--gold), var(--rose));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(232,176,75,0.35);
  }

  /* --- ending --- */
  .ending{
    text-align:center; padding:40px 10px;
  }
  .ending h2{ font-family:'Shippori Mincho',serif; font-size:24px; margin-bottom:10px; }
  .ending p{ font-size:14px; opacity:0.75; line-height:1.9; max-width:480px; margin:0 auto 22px; }
  .ending .final-num{
    font-family:'JetBrains Mono',monospace; font-size:40px; color:var(--gold); margin-bottom:6px;
  }
  #screen-ending.is-max .scene{
    border-color: var(--card-color, var(--gold));
    box-shadow:0 0 50px -14px var(--card-color, var(--gold)), inset 0 0 40px -20px var(--card-color, var(--gold));
  }
  #screen-ending.is-max #end-label{
    color: var(--glow-c, var(--glow));
    font-weight:700;
    text-shadow:0 0 12px var(--card-color, var(--gold));
  }
  #screen-ending.is-max #end-title{
    background: linear-gradient(90deg, var(--glow-c,var(--glow)), var(--card-color,var(--gold)));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* --- finale (epilogue collection) --- */
  .finale-title{
    font-family:'Shippori Mincho',serif; font-weight:800;
    font-size:clamp(24px,6vw,32px); text-align:center; margin:2px 0 18px;
    background: linear-gradient(90deg, #ffdf99, #ffc2d1, #bcdcff, #d9c2ff, #a8e8cf, #fff5d9);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .finale-intro{
    text-align:center; font-size:14px; opacity:0.8; line-height:1.9;
    max-width:520px; margin:0 auto 28px;
  }
  .finale-vignettes{
    display:flex; flex-direction:column; gap:14px; margin-bottom:30px;
  }
  .finale-card{
    border:1px solid var(--line); border-left:3px solid var(--vc, var(--gold));
    border-radius:14px; padding:16px 18px;
    background:linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  }
  .finale-card .fname{
    font-family:'Shippori Mincho',serif; font-weight:700; font-size:14px;
    color:var(--vc, var(--gold)); margin-bottom:6px;
  }
  .finale-card .ftext{
    font-size:13.5px; line-height:1.85; opacity:0.85;
  }
  .finale-closing{
    text-align:center; font-size:14px; line-height:2.1; opacity:0.85;
    max-width:480px; margin:0 auto 26px; white-space:pre-wrap;
  }

  .hidden{ display:none !important; }

  .mute-btn{
    position:fixed; top:16px; right:16px; z-index:60;
    width:42px; height:42px; border-radius:50%;
    border:1px solid var(--line); background:rgba(20,15,25,0.55);
    color:var(--ink); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(6px);
    transition: border-color .2s, transform .15s;
  }
  .mute-btn:hover{ border-color:var(--gold); transform:scale(1.06); }

  /* --- title screen --- */
  #screen-title{
    min-height:72vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    cursor:pointer;
  }
  #screen-title .lede{ max-width:420px; }
  .tap-start{
    margin-top:46px; display:flex; flex-direction:column;
    align-items:center; gap:14px;
  }
  .tap-circle{
    width:64px; height:64px; border-radius:50%;
    border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    color:var(--glow); font-size:19px; padding-left:4px;
    animation: pulseRing 2.2s ease-in-out infinite;
  }
  @keyframes pulseRing{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,176,75,0.35); transform:scale(1); }
    50%{ box-shadow:0 0 0 16px rgba(232,176,75,0); transform:scale(1.06); }
  }
  .tap-label{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:0.3em; color:var(--gold); opacity:0.85;
  }
</style>
</head>
<body data-tier="0">
<audio id="bgm" loop preload="auto"></audio>
<button class="mute-btn" id="mute-btn" title="BGMのオン/オフ">🔊</button>
<div class="stars"></div>
<div class="wrap">

  <!-- TITLE SCREEN -->
  <div id="screen-title">
    <div class="eyebrow">Isekai Paradise Affection Engine — Prototype</div>
    <h1 class="title">異世界パラダイス幸福度クロニクル</h1>
    <p class="lede">現代日本の"良いとこ取り"の暮らしを、この世界に生きる少女たちへ。<br>小さな親切が、時に想像を超えて心を揺さぶる — その瞬間を体験するミニデモです。</p>
    <div class="tap-start" id="tap-start">
      <div class="tap-circle">▶</div>
      <div class="tap-label">TAP TO START</div>
    </div>
  </div>

  <!-- SELECT SCREEN -->
  <div id="screen-select" class="hidden">
    <div class="eyebrow">Choose Your Story</div>
    <div class="total-happiness" id="total-happiness">総幸福度: 0</div>
    <div class="char-grid" id="char-grid"></div>
    <button class="reset-save-btn" id="btn-reset-save">セーブデータをリセット</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="hidden">
    <div class="topbar">
      <button class="backbtn" id="btn-back">← キャラクター選択に戻る</button>
    </div>
    <div class="who">
      <div class="dot" id="who-dot"></div>
      <div>
        <div class="name" id="who-name"></div>
        <div class="rank" id="who-rank"></div>
      </div>
    </div>
    <div style="height:14px;"></div>
    <div class="gauge-shell"><div class="gauge-fill" id="gauge-fill"></div></div>
    <div class="gauge-num" id="gauge-num">幸福度 0</div>

    <div class="scene">
      <div class="scene-label" id="scene-label">SCENE</div>
      <div class="scene-text" id="scene-text"></div>
    </div>

    <div class="choices" id="choices"></div>
  </div>

  <!-- ENDING SCREEN -->
  <div id="screen-ending" class="hidden">
    <div class="scene ending">
      <div class="scene-label" id="end-label">EPILOGUE</div>
      <h2 id="end-title"></h2>
      <div class="final-num" id="end-num"></div>
      <p id="end-text"></p>
      <button class="continue-btn" id="btn-ending-back" style="float:none;">キャラクター選択に戻る</button>
    </div>
  </div>

  <!-- FINALE SCREEN -->
  <div id="screen-finale" class="hidden">
    <div class="eyebrow">SPECIAL EPILOGUE COLLECTION</div>
    <h2 class="finale-title">それからの日々</h2>
    <p class="finale-intro" id="finale-intro"></p>
    <div class="finale-vignettes" id="finale-vignettes"></div>
    <p class="finale-closing" id="finale-closing"></p>
    <button class="continue-btn" id="btn-finale-back" style="float:none;">キャラクター選択に戻る</button>
  </div>

</div>

<div class="burst-layer">
  <div class="burst" id="burst"></div>
</div>
<div class="rankup-banner" id="rankup-banner">
  <div class="lbl">RANK UP</div>
  <div class="big" id="rankup-text"></div>
</div>

<script>
const RANKS = [
  {min:0,   name:"警戒"},
  {min:50,  name:"顔見知り"},
  {min:100, name:"友達"},
  {min:180, name:"親友"},
  {min:250, name:"唯一無二の相棒"}
];

const DATA = {
  maia: {
    name:"マイア",
    subtitle:"スラム街で日銭を稼いでいた少女",
    color:"#e8b04b", glow:"#ffdf99", emblem:"麻", tier:1,
    event1:{
      label:"SCENE 01 — 邂逅",
      text:"路地裏の奥、ゴミの山にもたれて座り込む少女を見つけた。頬はこけ、唇は乾き切っている。かつてこの世界にはなかった「見捨てない」という選択肢を、あなたは持っている。",
      choices:[
        {label:"迷わず抱き上げ、屋敷の医務室へ走る", delta:100, route:"A",
         result:"少女——マイアは、生まれて初めて味わう安堵に声もなく涙をこぼした。「どうして、見ず知らずの私を……」その日から、彼女の世界にあなたという光が差し込んだ。"},
        {label:"距離を保ったまま、その場で回復魔法をかける", delta:80, route:"B",
         result:"淡い光がマイアを包み込む。目を覚ました彼女は、警戒するように少し距離を取りながらも深く頭を下げた。「命の恩、必ず返します」——庇護されるのではなく、自分の足で立つことを、彼女は選んだ。"}
      ]
    },
    routes:{
      A:{
        routeLabel:"庇護ルート",
        epilogueText:"スラムの片隅で消えかけていた小さな灯りは、今では屋敷全体を照らすほどの温かな光になった。四季が巡るたび、マイアはあなたの隣で新しい『初めて』を重ねていく。彼女にとってこの場所は、もう帰る場所ではなく——ただ一つの、居場所そのものだった。",
        events:[
          {
            label:"SCENE 02 — 恩返し",
            text:"熱が下がったマイアが、あなたの屋敷を訪ねてきた。伏し目がちに、何度もお辞儀を繰り返している。",
            choices:[
              {label:"「気にしなくていい」と笑いかける", delta:10,
               result:"マイアは戸惑いながらも、少しだけ肩の力を抜いた。"},
              {label:"空いている客間を、そのまま彼女の部屋にすると告げる", delta:35,
               result:"「え……いいの、ですか」ふかふかのベッド、清潔なシーツ。スラムでは考えられなかった生活に、マイアの目に涙が浮かんだ。"}
            ]
          },
          {
            label:"SCENE 03 — 食卓",
            text:"夕食の時間。厨房から漂う匂いに、マイアの腹が小さく鳴った。",
            choices:[
              {label:"屋台で買った串焼きを分けてあげる", delta:15,
               result:"「おいしい……」小さくつぶやくマイア。素朴だけど、心のこもった一口だった。"},
              {label:"前世の知識を総動員し、和食フルコースを振る舞う", delta:55,
               result:"だし巻き卵、炊きたての白米、丁寧に引いた出汁の吸い物——涙腺が崩壊したマイアは、しばらく箸を持てなかった。「こんな世界が、あるなんて……」"}
            ]

let state = { charKey:null, affection:{}, route:{}, clearedRoutes:{}, characterTotal:{}, eventIndex:0, awaitingContinue:false };
Object.keys(DATA).forEach(k => { state.affection[k] = 0; state.route[k] = null; state.clearedRoutes[k] = {}; state.characterTotal[k] = 0; });

/* --- セーブデータ(localStorage) --- */
const SAVE_KEY = 'isekai_paradise_save_v1';
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data.clearedRoutes){
      Object.keys(data.clearedRoutes).forEach(k=>{ if(state.clearedRoutes[k]){ Object.assign(state.clearedRoutes[k], data.clearedRoutes[k]); } });
    }
    if(data.characterTotal){
      Object.keys(data.characterTotal).forEach(k=>{ if(k in state.characterTotal){ state.characterTotal[k] = data.characterTotal[k]; } });
    }
  }catch(e){ console.warn('セーブデータの読み込みに失敗しました', e); }
}
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      clearedRoutes: state.clearedRoutes,
      characterTotal: state.characterTotal
    }));
  }catch(e){ console.warn('セーブデータの保存に失敗しました', e); }
}
function resetSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  Object.keys(DATA).forEach(k => { state.clearedRoutes[k] = {}; state.characterTotal[k] = 0; });
  renderSelect();
}
loadSave();

/* --- 解放システム(累計幸福度によるキャラ解放) --- */
const TIER_THRESHOLDS = { 2: 2500, 3: 5000 };
function grandTotal(){
  return Object.values(state.characterTotal).reduce((a,b)=>a+b, 0);
}
function isCharUnlocked(key){
  const t = DATA[key].tier || 1;
  if(t <= 1) return true;
  const need = TIER_THRESHOLDS[t];
  return need === undefined ? true : grandTotal() >= need;
}

/* --- 特別編(全員読了で解放されるエピローグ集) --- */
function clearedRouteCount(){
  return Object.keys(DATA).reduce((n,k)=>{
    const c = state.clearedRoutes[k] || {};
    return n + (c.A ? 1 : 0) + (c.B ? 1 : 0);
  }, 0);
}
function isFinaleUnlocked(){
  return Object.keys(DATA).every(k=>{
    const c = state.clearedRoutes[k] || {};
    return c.A && c.B;
  });
}

function rankFor(v){
  let r = RANKS[0], idx = 0;
  RANKS.forEach((rk,i)=>{ if(v>=rk.min){ r=rk; idx=i; } });
  return {name:r.name, idx};
}
function tierFor(v){ return rankFor(v).idx; }

// 分岐ルート対応: event1(共有シーン) + routes[X].events、または従来の events[] のどちらにも対応
function getEventList(key){
  const c = DATA[key];
  if(c.routes){
    const r = state.route[key];
    if(r && c.routes[r]){ return [c.event1, ...c.routes[r].events]; }
    return [c.event1];
  }
  return c.events;
}
function getEpilogueText(key){
  const c = DATA[key];
  if(c.routes && state.route[key] && c.routes[state.route[key]]){
    return c.routes[state.route[key]].epilogueText;
  }
  return c.epilogueText;
}
function routeKeyFor(key){
  return DATA[key].routes ? (state.route[key] || 'A') : 'main';
}

/* --- BGM engine --- */
const CHAR_KEYS = Object.keys(DATA); // 並び順 = キャラ選択カードの表示順
function charBgmFile(key){
  const idx = CHAR_KEYS.indexOf(key) + 1;
  return 'character_bgm' + String(idx).padStart(2,'0') + '.mp3';
}
const bgm = document.getElementById('bgm');
const muteBtn = document.getElementById('mute-btn');
let bgmMuted = false;
let bgmFadeTimer = null;
const BGM_VOLUME = 0.55;

function fadeBgmTo(target, ms){
  clearInterval(bgmFadeTimer);
  const start = bgm.volume;
  const steps = 20;
  let i = 0;
  bgmFadeTimer = setInterval(()=>{
    i++;
    bgm.volume = Math.max(0, Math.min(1, start + (target-start) * (i/steps)));
    if(i>=steps){ clearInterval(bgmFadeTimer); }
  }, ms/steps);
}

function playBgm(src){
  if(bgm.getAttribute('data-src') === src){ return; } // 既に再生中なら再スタートしない
  bgm.setAttribute('data-src', src);
  const doSwitch = ()=>{
    bgm.src = src;
    bgm.currentTime = 0;
    bgm.volume = 0;
    bgm.play().then(()=>{ fadeBgmTo(bgmMuted ? 0 : BGM_VOLUME, 900); }).catch(()=>{ /* ユーザー操作待ち */ });
  };
  if(bgm.src && !bgm.paused){
    fadeBgmTo(0, 400);
    setTimeout(doSwitch, 400);
  } else {
    doSwitch();
  }
}

muteBtn.addEventListener('click', ()=>{
  bgmMuted = !bgmMuted;
  muteBtn.textContent = bgmMuted ? '🔇' : '🔊';
  fadeBgmTo(bgmMuted ? 0 : BGM_VOLUME, 300);
  if(!bgmMuted && bgm.paused){ bgm.play().catch(()=>{}); }
});

function progressLabel(key){
  const c = DATA[key];
  const cleared = state.clearedRoutes[key] || {};
  const total = state.characterTotal[key] || 0;
  if(c.routes){
    const a = cleared.A ? '既読' : '未読';
    const b = cleared.B ? '既読' : '未読';
    return `累計幸福度 ${total}　|　ルートA ${a} / ルートB ${b}`;
  }
  return `累計幸福度 ${total}　|　${cleared.main ? '既読' : '未読'}`;
}

function startGame(key){
  state.charKey = key;
  state.eventIndex = 0;
  state.affection[key] = 0;
  state.route[key] = null;
  document.getElementById('screen-select').classList.add('hidden');
  document.getElementById('screen-ending').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');
  const c = DATA[key];
  setCardVars(document.getElementById('screen-game'), c.color, c.glow);
  document.getElementById('who-dot').style.background = c.color;
  document.getElementById('who-dot').style.boxShadow = '0 0 16px -2px ' + c.color;
  document.getElementById('who-name').textContent = c.name;
  document.body.setAttribute('data-tier', tierFor(state.affection[key]));
  playBgm(charBgmFile(key));
  renderEvent();
}

function updateGauge(){
  const key = state.charKey;
  const aff = state.affection[key];
  const rk = rankFor(aff);
  document.getElementById('who-rank').textContent = '絆ランク: ' + rk.name;
  document.getElementById('gauge-num').textContent = '幸福度 ' + aff;
  const nextRank = RANKS[rk.idx+1];
  const span = nextRank ? (nextRank.min - RANKS[rk.idx].min) : 60;
  const within = nextRank ? (aff - RANKS[rk.idx].min) : span;
  const pct = nextRank ? Math.min(100, Math.round((within/span)*100)) : 100;
  document.getElementById('gauge-fill').style.width = pct + '%';
}

function renderEvent(){
  const key = state.charKey;
  const events = getEventList(key);
  const ev = events[state.eventIndex];
  document.getElementById('scene-label').textContent = ev.label;
  document.getElementById('scene-text').textContent = ev.text;
  updateGauge();
  const box = document.getElementById('choices');
  box.innerHTML = '';
  ev.choices.forEach(ch=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `${ch.label}<span class="delta-hint">選択すると幸福度が変化します</span>`;
    btn.addEventListener('click', ()=> pickChoice(ev, ch));
    box.appendChild(btn);
  });
}

function pickChoice(ev, ch){
  const key = state.charKey;
  if(ch.route){ state.route[key] = ch.route; }
  const before = state.affection[key];
  const beforeRank = rankFor(before);
  state.affection[key] = before + ch.delta;
  const after = state.affection[key];
  const afterRank = rankFor(after);

  // show result text + continue button instead of choices
  document.getElementById('scene-text').textContent = ch.result;
  const box = document.getElementById('choices');
  box.innerHTML = '';
  const cont = document.createElement('button');
  cont.className = 'continue-btn';
  cont.textContent = ev.final ? 'エンディングへ →' : '次へ →';
  cont.addEventListener('click', ()=>{
    if(ev.final){ showEnding(); }
    else { state.eventIndex++; renderEvent(); }
  });
  box.appendChild(cont);

  updateGauge();
  document.body.setAttribute('data-tier', afterRank.idx);
  playBurst(ch.delta, afterRank.idx > beforeRank.idx ? afterRank.name : null);
}

function playBurst(delta, rankUpName){
  const burst = document.getElementById('burst');
  burst.textContent = '+' + delta + ' 幸福度';
  burst.classList.remove('play'); void burst.offsetWidth; burst.classList.add('play');

  if(rankUpName){
    const banner = document.getElementById('rankup-banner');
    document.getElementById('rankup-text').textContent = rankUpName;
    banner.classList.remove('play'); void banner.offsetWidth; banner.classList.add('play');
  }
}

function showEnding(){
  const key = state.charKey;
  const c = DATA[key];
  const events = getEventList(key);
  const ev = events[events.length-1];
  const aff = state.affection[key];
  const rk = rankFor(aff);
  const isMax = rk.idx === RANKS.length - 1;
  state.clearedRoutes[key][routeKeyFor(key)] = true;
  state.characterTotal[key] = (state.characterTotal[key] || 0) + aff;
  saveGame();
  document.getElementById('screen-game').classList.add('hidden');
  document.getElementById('screen-ending').classList.remove('hidden');
  setCardVars(document.getElementById('screen-ending'), c.color, c.glow);
  const routeTag = c.routes ? `【${c.routes[state.route[key]].routeLabel}】` : '';
  document.getElementById('end-label').textContent = (isMax ? 'TRUE EPILOGUE — 絆MAX到達 ' : 'EPILOGUE ') + routeTag;
  document.getElementById('end-title').textContent = c.name + ' — ' + rk.name;
  document.getElementById('end-num').textContent = `今回の幸福度 +${aff} ・ 累計 ${state.characterTotal[key]}`;
  document.getElementById('end-text').textContent = isMax ? getEpilogueText(key) : ev.endingText;
  const box = document.getElementById('screen-ending');
  box.classList.toggle('is-max', isMax);
  if(isMax){
    const banner = document.getElementById('rankup-banner');
    document.getElementById('rankup-text').textContent = '絆MAX — TRUE EPILOGUE';
    banner.classList.remove('play'); void banner.offsetWidth; banner.classList.add('play');
  }
}

document.getElementById('btn-back').addEventListener('click', renderSelect);
document.getElementById('btn-ending-back').addEventListener('click', renderSelect);
document.getElementById('btn-finale-back').addEventListener('click', renderSelect);
document.getElementById('btn-reset-save').addEventListener('click', ()=>{
  if(confirm('セーブデータ(既読状態・累計幸福度)を全て消去します。よろしいですか?')){
    resetSave();
  }
});

document.getElementById('screen-title').addEventListener('click', ()=>{
  document.getElementById('screen-title').classList.add('hidden');
  renderSelect();
});
</script>
</body>
