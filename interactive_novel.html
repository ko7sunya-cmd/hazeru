<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インタラクティブノベル｜はぜるの作品</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 作品カード全体をリンク化 */
        .work-card-link {
            display: block;
            text-decoration: none;
            color: inherit;
            margin-bottom: 20px;
        }

        .work-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .work-card-link:hover .work-card {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .work-card h3 {
            margin: 0 0 8px 0;
            color: #ffb74d; /* オレンジの差し色 */
        }
        .work-card p {
            margin: 0;
            font-size: 0.9em;
            color: #ccc;
            line-height: 1.6;
        }
        .play-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 12px;
            background: #ffb74d;
            color: #111;
            font-weight: bold;
            font-size: 0.8em;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <p class="site-title">はぜるの作品</p>
            <h1>インタラクティブノベル</h1>
            <nav class="site-menu">
                <a href="index.html">トップ</a>
            </nav>
        </header>

        <main>
            <section class="intro">
                <p>BGMと共に物語が展開する、選択式のインタラクティブノベル。<br>
                あなたの選択によって、ストーリーの行方と結末が変化します。</p>
            </section>

            <section class="work-list">
                <h2>作品一覧</h2>

                <!-- 🎴 target="_blank" で別タブ開く作品カード -->
                <a href="isekai_paradise/index.html" target="_blank" rel="noopener noreferrer" class="work-card-link">
                    <div class="work-card">
                        <h3>異世界パラダイス幸福度クロニクル</h3>
                        <p>現代日本の"良いとこ取り"の暮らしを、この世界に生きる少女たちへ。小さな親切が心を揺さぶるミニデモ作品。</p>
                        <span class="play-badge">▶ プレイする ↗</span>
                    </div>
                </a>

            </section>
        </main>

        <footer style="margin-top: 50px; text-align: center; color: #777;">
            <p>&copy; 2026 はぜる</p>
        </footer>
    </div>
</body>
</html>
